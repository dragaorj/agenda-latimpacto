/* ============================================================
   LATIMPACTO — overrides do design system (cards suaves)
   ============================================================ */
body{letter-spacing:-.005em;}
.num,.tcell-t,.cgrid-slot-time,.zoom-label,.grid-zoom-label{font-variant-numeric:tabular-nums;}

/* Cards: superfície branca/neutra + filete colorido SÓ na borda esquerda */
.card,.cgrid-card,.lcard{
  background:var(--surface)!important;
  color:var(--text)!important;
  border:1px solid var(--border);
  border-left-width:var(--filet,4px);
  box-shadow:0 1px 1px rgba(40,20,60,.03);
}
.card{border-radius:var(--r);}
.card::before{display:none!important;}
.card .ctitle,.cgrid-title,.ltitle{color:var(--text);font-weight:500;}
.card .card-meta-left{color:var(--text2);opacity:1;}
.card:hover,.cgrid-card:hover,.lcard:hover{box-shadow:var(--sh);border-color:var(--muted);filter:none;}
/* neutraliza qualquer fundo herdado das classes de cor antigas */
.c0,.c1,.c2,.c3,.c4,.c5,.c6,.c7,
.ch0,.ch1,.ch2,.ch3,.ch4,.ch5,.ch6,.ch7,.ch8,.c-neu,
.gantt-bar.c0,.gantt-bar.c1,.gantt-bar.c2,.gantt-bar.c3,.gantt-bar.c4,.gantt-bar.c5,
.gantt-bar.c6,.gantt-bar.c7,.gantt-bar.ch0,.gantt-bar.ch1,.gantt-bar.ch2,.gantt-bar.ch3,
.gantt-bar.ch4,.gantt-bar.ch5,.gantt-bar.ch6,.gantt-bar.ch7,.gantt-bar.ch8,.gantt-bar.c-neu{
  background:var(--surface);color:var(--text);
}

/* Cabeçalho de sala (grade): pill neutro com leve tom da marca */
.rbadge{background:var(--blue-lt)!important;color:var(--blue)!important;font-weight:600;letter-spacing:.01em;}

/* Badge de formato: pill uniforme e suave (menos cores) */
.fmt-badge{background:var(--bg)!important;color:var(--text2)!important;border:1px solid var(--border);font-weight:600;letter-spacing:.02em;text-transform:uppercase;}
[data-theme="dark"] .fmt-badge{background:var(--surface)!important;}

/* Tags de acessibilidade neutras */
.acc-tag{background:var(--bg);color:var(--text2);border:1px solid var(--border);}

/* Seletor de idioma com bandeiras (dropdown) */
.lang-dd{position:relative;flex-shrink:0;margin-right:2px;}
.lang-trigger{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:5px 9px;cursor:pointer;color:var(--text);font-family:var(--font);font-size:12px;font-weight:600;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;transition:border-color .18s,background .18s;}
.lang-trigger:hover{border-color:var(--muted);}
.lang-flag{width:22px;height:15px;border-radius:3px;overflow:hidden;display:inline-flex;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.07);}
.lang-flag svg{width:100%;height:100%;display:block;}
.lang-caret{color:var(--text2);transition:transform .2s;}
.lang-dd.open .lang-caret{transform:rotate(180deg);}
.lang-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh);padding:5px;min-width:168px;z-index:10000;display:none;flex-direction:column;gap:1px;animation:ddIn .18s cubic-bezier(.22,1,.36,1);}
@keyframes ddIn{from{transform:translateY(-6px);}to{transform:none;}}
.lang-dd.open .lang-menu{display:flex;}
.lang-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--text);font-family:var(--font);font-size:13px;font-weight:500;padding:8px 10px;border-radius:8px;cursor:pointer;}
.lang-opt:hover{background:var(--bg);}
.lang-opt.on{color:var(--brand);font-weight:600;}
.lang-opt.on::after{content:'✓';margin-left:auto;color:var(--brand);font-weight:700;font-size:13px;}
/* abas do painel de conta */
.auth-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:-4px -2px 16px;padding-bottom:0;}
.auth-tab{font-family:var(--font);font-size:13px;font-weight:600;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;padding:8px 10px;margin-bottom:-1px;cursor:pointer;transition:color .15s;}
.auth-tab.on{color:var(--brand);border-bottom-color:var(--brand);}
.auth-tab:hover{color:var(--text);}
/* botões de ícone (editar/excluir) */
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-size:14px;flex-shrink:0;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--bg);color:var(--text);border-color:var(--muted);}
.icon-btn.danger:hover{color:#b4453f;border-color:#b4453f;}
/* pílulas de idioma nos campos do formulário */
.ml-pills{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle;}
.ml-pill{font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:2px 6px;cursor:pointer;transition:all .12s;}
.ml-pill.on{background:var(--blue-lt);color:var(--brand);border-color:var(--brand);}
.ml-in{margin-bottom:0;}
/* refino minimalista: legenda de hubs mais leve, stats discreto */
.leg-item{opacity:.92;transition:opacity .15s;}
.leg-item:hover{opacity:1;}
.stats{color:var(--text2);}
.stats b{color:var(--text);font-weight:600;}
.cgrid-card,.card,.lcard{transition:box-shadow .15s,border-color .15s,transform .15s;}
.lcard:hover{transform:translateY(-1px);}
/* Filtros de sala / chips ativos na cor da marca */
.room-filter-btn{color:var(--text2);}
.leg-item .dot,.srch-dot{box-shadow:none;}

/* Tabs ativas / botões primários já herdam --blue=#611780 */
.logo b{color:var(--brand);}
.dtab.on{border-color:var(--brand);color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent);}
.ptab.on{border-bottom-color:var(--brand);color:var(--brand);}

/* Vista “contorno completo” (Tweak): borda fina colorida em volta */
body[data-cardstyle="outline"] .card,
body[data-cardstyle="outline"] .cgrid-card,
body[data-cardstyle="outline"] .lcard{
  border-color:var(--card-accent,var(--border));
  border-left-width:1px;
  box-shadow:none;
}
/* Vista “tint suave” (Tweak): fundo bem clarinho do hub + filete */
body[data-cardstyle="tint"] .card,
body[data-cardstyle="tint"] .cgrid-card,
body[data-cardstyle="tint"] .lcard{
  background:var(--card-tint,var(--surface))!important;
  border-left-width:var(--filet,4px);
}

// Retorna tradução em cache, ou null enquanto busca (dispara o fetch 1x).
function _trGet(text, src, tl){
  text=(text==null?'':String(text)).trim(); if(!text) return '';
  if(src!=='auto' && src===tl) return text;
  var key=tl+'|'+text;
  if(_trCache[key]!=null) return _trCache[key];
  if(!_trPending[key]){
    _trPending[key]=true;
    _translateText(text, src, tl).then(function(tr){
      delete _trPending[key];
      if(tr && tr.trim()){
        var diff = tr.trim()!==text;
        _trCache[key]=tr; _trPersist();
        if(diff) _trRerender();
      }
    }).catch(function(){ delete _trPending[key]; });
  }
  return null;
}

    if(src===LANG) return v[src];
    var tr=_trGet(v[src], src, LANG);
    return (tr!=null)?tr:v[src];

}

function toggleLangMenu(e){
  if(e) e.stopPropagation();
  var d=document.getElementById('langSwitch'), m=document.getElementById('langMenu'), t=document.getElementById('langTrigger');
  if(!d||!m||!t) return;
  if(d.classList.contains('open')){ d.classList.remove('open'); return; }
  d.classList.add('open');
  var r=t.getBoundingClientRect();
  var w=m.offsetWidth||168;
  var left=r.right-w; if(left<8) left=8; if(left+w>window.innerWidth-8) left=window.innerWidth-8-w;
  m.style.top=(r.bottom+7)+'px';
  m.style.left=left+'px';
}

// ── Auto-tradução de campos multilíngues ──────────────────────────────
// Quando o editor preenche só um idioma, os demais são traduzidos
// automaticamente no momento de salvar e gravados no banco (ficam offline).
// Usa endpoints públicos sem chave; se falhar, deixa vazio (o L() faz
// fallback para o idioma preenchido).
function _translateText(text, source, target){
  text=(text||'').trim();
  if(!text) return Promise.resolve('');
  if(source===target) return Promise.resolve(text);
  function viaGoogle(){
    var u='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+source+'&tl='+target+'&dt=t&q='+encodeURIComponent(text);
    return fetch(u).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
      if(j && j[0]) return j[0].map(function(seg){ return seg[0]; }).join('');
      throw 0;
    });
  }
  function viaMyMemory(){
    if(source==='auto') return Promise.reject(0);
    var u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+source+'|'+target;
    return fetch(u).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
      var t=j&&j.responseData&&j.responseData.translatedText;
      if(t && j.responseStatus==200) return t;
      throw 0;
    });
  }
  return viaGoogle().catch(viaMyMemory).catch(function(){ return ''; });
}
// Preenche os idiomas vazios de um objeto {pt,en,es} a partir do idioma
// preenchido (prioridade PT → EN → ES). Resolve com o próprio objeto.
function _autoFillML(obj){
  if(!obj || typeof obj!=='object') return Promise.resolve(obj);
  var src = obj.pt?'pt':(obj.en?'en':(obj.es?'es':null));
  if(!src) return Promise.resolve(obj);
  var srcText=obj[src];
  var targets=['pt','en','es'].filter(function(l){ return l!==src && !(obj[l]&&obj[l].trim()); });
  if(!targets.length) return Promise.resolve(obj);
  return Promise.all(targets.map(function(tl){
    return _translateText(srcText, src, tl).then(function(tr){ if(tr) obj[tl]=tr; });
  })).then(function(){ return obj; });
}

function buildSlots(){
  var slots=[],h=8,m=0;
  while(h<20||(h===20&&m===0)){
    var l=p2(h)+':'+p2(m);
    slots.push({label:l,isBreak:false});
    m+=30; if(m>=60){h++;m-=60;}
  }
  slots.push({label:'20:00',isBreak:false});
  return slots;
}

  tok=(tok||'').trim();
  function ok(p){ AUTH=p; WP_ENABLED=true; WP_USER=profileName(p); try{ localStorage.setItem(SESSION_KEY, tok); }catch(e){} if(window.SB&&SB.enabled){ SB.setToken(tok); } logAction('Entrou no modo edição'); applyMode(); if(cb) cb(true); return true; }
  function fail(){ if(cb) cb(false); return false; }
  if(window.SB && SB.enabled){
    SB.login(tok).then(function(p){ if(p){ ok({id:p.id,first:p.first,last:p.last,email:p.email,phone:p.phone,photo:p.photo,role:p.role,token:tok}); } else { fail(); } }).catch(function(){ fail(); });

  }
  var p = profileByToken(tok);
  if(!p){ return fail(); }
  return ok(p);
}

function closeToolsMenu(){ var m=document.getElementById('toolsMenu'); if(m) m.classList.remove('open'); var rail=document.getElementById('rail'); if(rail) rail.classList.remove('pinned'); }
function _positionRailMenu(){
  var m=document.getElementById('toolsMenu'), b=document.getElementById('railTools');
  if(!m||!b||!m.classList.contains('open')) return;
  var r=b.getBoundingClientRect();
  var h=m.offsetHeight||220;

  var top=r.top+r.height-h; if(top<8) top=8;

}
function toggleRailTools(e){
  if(e) e.stopPropagation();
  var m=document.getElementById('toolsMenu'), b=document.getElementById('railTools'), rail=document.getElementById('rail');
  if(!m||!b) return;
  if(m.classList.contains('open')){ closeToolsMenu(); return; }
  // Mantém o trilho EXPANDIDO enquanto o menu estiver aberto, para o popup
  // permanecer colado ao botão. Sem isto, ao tirar o mouse o trilho recolhia
  // (236px → 66px) e o popup ficava "solto", longe do ícone.
  if(rail) rail.classList.add('pinned');
  if(m.parentNode!==document.body) document.body.appendChild(m);
  m.classList.add('open');
  _positionRailMenu();
}
// Rede de segurança: se o trilho mudar de largura (expandir/recolher) enquanto
// o menu estiver aberto, reposiciona o popup para continuar colado ao botão.
(function(){
  var rail=document.getElementById('rail');
  if(rail){
    rail.addEventListener('mouseenter', _positionRailMenu);
    rail.addEventListener('mouseleave', _positionRailMenu);

})();

function showPage(p, fromHistory){
  if(p==='admin') p='spk';            // gerenciar foi absorvido em Palestrantes
  if(p!=='home'&&p!=='agenda'&&p!=='spk') p='home';
  curPage = p;
  document.body.setAttribute('data-page', p);

  // Oculta tudo
  document.getElementById('pgHighlights').style.display = 'none';
  document.getElementById('pgAgenda').style.display     = 'none';
  document.getElementById('pgAgendaHdr').style.display  = 'none';
  document.getElementById('pgSpk').style.display        = 'none';
  document.getElementById('pgAdmin').style.display      = 'none';
  var dc=document.getElementById('dayControls'); if(dc) dc.style.display='none';

  // Reseta tabs (mobile + desktop highlight feito no _syncRail)
  ['ptHome','ptAgenda','ptSpk','ptAdmin'].forEach(function(id){ var e=document.getElementById(id); if(e) e.className='ptab'; });

  var mab = document.getElementById('btnAddTalk');
  if(mab){ mab.style.display='none'; }

  if(p==='home'){
    document.getElementById('pgHighlights').style.display='flex';
    var pth=document.getElementById('ptHome'); if(pth) pth.className='ptab on';
    renderBento();
    _animIn(document.getElementById('pgHighlights'));
  } else if(p==='agenda'){
    document.getElementById('pgAgendaHdr').style.display='block';
    if(dc) dc.style.display='block';
    document.getElementById('pgAgenda').style.display='block';
    var pta=document.getElementById('ptAgenda'); if(pta) pta.className='ptab on';
    renderDayTabs(); _setActiveDay(curDay); setView(curView);
    if(mab && WP_ENABLED){ mab.onclick=openAddTalk; mab.style.display='flex'; }
    renderMain();
    _animIn(document.getElementById('pgAgenda'));
  } else if(p==='spk'){
    document.getElementById('pgSpk').style.display='block';
    if(mab){ mab.style.display='none'; }
    renderPubSpkGrid(_pubSpkQ||'');
    _animIn(document.getElementById('pgSpk'));
    var pts=document.getElementById('ptSpk'); if(pts) pts.className='ptab on';
  }
  _syncRail();
  _updatePtabAdd();
  // Integra com o histórico do navegador para que os botões Voltar/Avançar
  // (incluindo os botões laterais do mouse) naveguem entre as páginas.
  if(!fromHistory){
    try{
      if(!history.state || history.state._pg===undefined){
        history.replaceState({_pg:p}, '');      // primeira entrada (base)
      } else if(history.state._pg !== p){
        history.pushState({_pg:p}, '');          // só empilha ao mudar de página
      }
    }catch(e){}
  }
}

function _roomOf(rid){ for(var i=0;i<ROOMS.length;i++) if(ROOMS[i].id===rid) return ROOMS[i]; return null; }
function _eventStart(){ return new Date(DAYS[0].date+'T08:00:00'); }
function _eventEnd(){ return new Date(DAYS[NDAYS-1].date+'T20:00:00'); }
function _countdownDays(){ var ms=_eventStart()-new Date(); return ms<=0?0:Math.ceil(ms/86400000); }
function _isLive(){ var n=new Date(); return n>=_eventStart() && n<=_eventEnd(); }
function _totalTalks(){ var c=0; for(var d=0;d<NDAYS;d++) c+=_talksInDay(d); return c; }
function _firstTalkDay0(){

function _heroDates(){

function _migrateHighlights(H){
  if(!H) return _defaultHighlights();
  var d=_defaultHighlights();
  if(!H.hero) H.hero=d.hero;
  if(!H.auto) H.auto={};
  if(typeof H.auto.countdown!=='boolean') H.auto.countdown=true;
  if(typeof H.auto.speakers!=='boolean') H.auto.speakers=true;
  // migra formato antigo (stats/opening) → numbers/editions
  if(typeof H.auto.numbers!=='boolean') H.auto.numbers=true;
  if(typeof H.auto.editions!=='boolean') H.auto.editions=true;
  if(!Array.isArray(H.numbers) || !H.numbers.length) H.numbers=d.numbers;
  if(!Array.isArray(H.editions) || !H.editions.length) H.editions=d.editions;
  if(!H.editionsTitle) H.editionsTitle=d.editionsTitle;
  if(!Array.isArray(H.cards)) H.cards=[];
  if(!H.about) H.about=d.about;
  if(!H.video) H.video=d.video;
  if(typeof H.auto.video!=='boolean') H.auto.video=true;

      (ed?'<button class="btile-edit" onclick="event.stopPropagation();openHighlightsManager()" title="'+t18('hlEditTitle')+'">'+penSvg+'</button>':'')+
      '<div class="ttl">'+esc(L(cd.title))+'</div>'+

    var row='';
    for(var s=0;s<pool.length;s++){ var sp=pool[s];
      var _ring=catColor(sp);
      var _avAttr = sp.photo
        ? 'class="ava photo-clickable" onclick="openPhotoLb(\''+sp.photo+'\',\''+esc(sp.name)+'\',\''+esc(sp.role||'')+'\',\''+esc(sp.company||'')+'\')" title="'+esc(sp.name)+'" style="border:3px solid '+_ring+';box-sizing:border-box;cursor:zoom-in;"'

  var agendaHtml='';
  (function(){
    function dayEvents(d){
      var sc=SCHEDULES[d]||{}, slots=Object.keys(sc), arr=[];
      for(var s=0;s<slots.length;s++){
        var sl=sc[slots[s]], rks=Object.keys(sl||{});
        for(var r=0;r<rks.length;r++){
          var t=sl[rks[r]]; if(!t) continue;

  // outro bloco → ficam lado a lado). O layout fica salvo em H.layout
  // (array de linhas; cada linha é um array de chaves de bloco).
  function _tagBlock(key, tileHtml){

    speakers:  _tagBlock('speakers', speakersHtml),

  var avail=defaultOrder.filter(function(k){ return blocks[k]; });

  // garante unicidade, anexa blocos novos como linha própria).
  var rows=[], seen={};
  (Array.isArray(H.layout)?H.layout:[]).forEach(function(row){
    if(!Array.isArray(row)) row=[row];
    var nr=[]; row.forEach(function(k){ if(avail.indexOf(k)>-1 && !seen[k]){ seen[k]=1; nr.push(k); } });
    if(nr.length) rows.push(nr);
  });
  avail.forEach(function(k){
    if(seen[k]) return; seen[k]=1;
    // Insere blocos novos (ainda não presentes no layout salvo) na sua
    // posição natural: logo após o bloco que o antecede na ordem padrão.
    var di=defaultOrder.indexOf(k), predRowIdx=-1;
    for(var p=di-1;p>=0;p--){
      var pk=defaultOrder[p];
      for(var ri=0;ri<rows.length;ri++){ if(rows[ri].indexOf(pk)>-1){ predRowIdx=ri; break; } }
      if(predRowIdx>-1) break;
    }
    if(predRowIdx<0) rows.unshift([k]); else rows.splice(predRowIdx+1,0,[k]);
  });
  H.layout=rows; // mantém normalizado em memória (sem salvar)

  var html='';
  if(ed) html+='<div class="bento-edithint"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg> Arraste os blocos para reorganizar · solte sobre outro bloco para <b>dividir a linha</b></div>';
  rows.forEach(function(row){
    html+='<div class="b-band b-row'+(row.length>1?' split':' solo')+'">';
    row.forEach(function(k){ html+=blocks[k]; });
    html+='</div>';
  });

  c.innerHTML=html;
  _startCountdown();
  renderNowChart();
  _startNowTicker();

}

function _bentoRemoveKey(rows,key){

function _bentoSplit(dragKey,targetKey,leftSide){

function _bentoNewRow(dragKey,targetKey,below){

    var inRow=null; for(var x=0;x<r0.length;x++){ if(r0[x].indexOf(dragKey)>-1){ inRow=r0[x]; break; } }
    if(inRow && inRow.length===1) return;

function _bentoZone(el,e){
  var r=el.getBoundingClientRect();
  var py=(e.clientY-r.top)/r.height;
  if(py<0.24) return 'top';
  if(py>0.76) return 'bottom';
  return (e.clientX-r.left)<r.width/2 ? 'left' : 'right';
}
function _bentoDnDInit(){
  var flow=document.getElementById('bentoGrid'); if(!flow) return;
  if(document.body.getAttribute('data-mode')!=='edit') return;
  var tiles=flow.querySelectorAll('[data-block]');
  var dragEl=null, dragKey=null;
  for(var i=0;i<tiles.length;i++){
    (function(el){
      el.setAttribute('draggable','true');
      el.addEventListener('dragstart',function(e){
        dragEl=el; dragKey=el.getAttribute('data-block');
        el.classList.add('bento-dragging');
        e.dataTransfer.effectAllowed='move';
        try{ e.dataTransfer.setData('text/plain',dragKey); }catch(_){}
      });
      el.addEventListener('dragend',function(){
        el.classList.remove('bento-dragging'); _bentoClearHints(); dragEl=null; dragKey=null;
      });
      el.addEventListener('dragover',function(e){
        if(!dragKey) return;
        e.preventDefault(); e.stopPropagation();
        e.dataTransfer.dropEffect='move';
        if(el===dragEl){ _bentoClearHints(); return; }
        _bentoHint(el,_bentoZone(el,e));
      });
      el.addEventListener('drop',function(e){
        if(!dragKey) return;
        e.preventDefault(); e.stopPropagation();
        var tgt=el.getAttribute('data-block');
        if(el!==dragEl){
          var z=_bentoZone(el,e);
          if(z==='left') _bentoSplit(dragKey,tgt,true);
          else if(z==='right') _bentoSplit(dragKey,tgt,false);
          else if(z==='top') _bentoNewRow(dragKey,tgt,false);
          else _bentoNewRow(dragKey,tgt,true);
        }
        _bentoClearHints();
      });
    })(tiles[i]);
  }
}

function _toMinG(t){ var p=String(t||'00:00').split(':'); return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0); }
function _chartEvents(day){
  var sc=SCHEDULES[day]||{}, slots=Object.keys(sc), arr=[];
  for(var i=0;i<slots.length;i++){
    var rks=Object.keys(sc[slots[i]]||{}); if(!rks.length) continue;

    var room=_roomOf(rks[0]); var ts=talkStyle(t,room);
    arr.push({min:st, end:st+(talkDur(t)||30), title:String(L(t.title)||''), id:t.id, room:rks[0], color:(ts&&ts.color)||'var(--brand)'});
  }

function _smoothPath(pts){
  if(!pts.length) return '';
  if(pts.length<2) return 'M'+pts[0].x+','+pts[0].y;
  var d='M'+pts[0].x+','+pts[0].y;
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    var c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    var c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d+=' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2.x.toFixed(1)+','+p2.y.toFixed(1);
  }
  return d;
}
var _nowChartData=null;
function renderNowChart(){
  var host=document.getElementById('bNowChart'); if(!host) return;
  var evs=_chartEvents(curDay);
  if(!evs.length){ host.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:13px;">—</div>'; _nowChartData=null; return; }
  var dayStart=Math.floor(evs[0].min/60)*60;
  var dayEnd=Math.ceil(Math.max.apply(null,evs.map(function(e){return e.end;}))/60)*60;
  if(dayEnd-dayStart<120) dayEnd=dayStart+120;
  // viewBox = tamanho real em pixels do container → sem distorção (preserveAspectRatio none mapeia 1:1)
  var W=Math.max(Math.round(host.clientWidth)||640, 280), H=Math.max(Math.round(host.clientHeight)||220, 190);
  var padL=40,padR=24,padT=Math.max(36,Math.round(H*0.16)),padB=40;
  var plotW=W-padL-padR, axisY=H-padB, midY=padT+(axisY-padT)/2, amp=Math.min(64,(axisY-padT)*0.34);
  function PX(m){ return padL+(m-dayStart)/(dayEnd-dayStart)*plotW; }
  var pts=evs.map(function(e,i){ return {x:PX(e.min), y:midY - amp*Math.cos(i*0.9), ev:e}; });
  var linePath=_smoothPath(pts);
  var areaPath=linePath+' L'+pts[pts.length-1].x.toFixed(1)+','+axisY+' L'+pts[0].x.toFixed(1)+','+axisY+' Z';
  // hour ticks
  var ticks='';
  for(var hh=dayStart; hh<=dayEnd; hh+=60){
    var tx=PX(hh);
    ticks+='<line x1="'+tx.toFixed(1)+'" y1="'+padT+'" x2="'+tx.toFixed(1)+'" y2="'+axisY+'" stroke="var(--border)" stroke-width="1" opacity=".5"/>'+
      '<text x="'+tx.toFixed(1)+'" y="'+(axisY+18)+'" text-anchor="middle" fill="var(--text2)" class="now-lbl">'+Math.floor(hh/60)+'h</text>';
  }
  // nodes + labels
  var nodes='', labels='';
  for(var i=0;i<pts.length;i++){
    var p=pts[i], e=p.ev;
    nodes+='<circle id="nowdot-'+i+'" class="nowdot" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="6" fill="'+e.color+'" stroke="var(--surface)" stroke-width="2" style="cursor:pointer" onclick="openTalkDetail(\''+esc(e.id)+'\')"><title>'+esc(_fmtMin(e.min)+' · '+e.title)+'</title></circle>';
    var below=p.y<midY;
    var ly=below?(p.y+16):(p.y-26);
    var ttl=e.title.length>16?e.title.slice(0,15)+'…':e.title;
    var lt=_fmtMin(e.min)+(ttl?' · '+ttl:'');
    var lw=Math.max(40, lt.length*5.3+12);
    var lx=Math.min(Math.max(p.x-lw/2, 2), W-lw-2);
    labels+='<g style="cursor:pointer" onclick="openTalkDetail(\''+esc(e.id)+'\')">'+
      '<rect x="'+lx.toFixed(1)+'" y="'+(ly-12)+'" width="'+lw.toFixed(1)+'" height="18" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>'+
      '<text x="'+(lx+lw/2).toFixed(1)+'" y="'+(ly+1)+'" text-anchor="middle" fill="var(--text)" class="now-lbl">'+esc(lt)+'</text>'+
    '</g>';
  }
  host.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="nowGrad" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="var(--brand)" stop-opacity=".26"/>'+
      '<stop offset="1" stop-color="var(--brand)" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    '<line x1="'+padL+'" y1="'+axisY+'" x2="'+(W-padR)+'" y2="'+axisY+'" stroke="var(--border)" stroke-width="1"/>'+
    ticks+
    '<path d="'+areaPath+'" fill="url(#nowGrad)"/>'+
    '<path d="'+linePath+'" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round"/>'+
    '<line id="nowLine" class="now-line" x1="0" y1="'+(padT-6)+'" x2="0" y2="'+axisY+'" stroke="#d6453d" stroke-width="2" style="display:none"/>'+
    '<circle id="nowMarker" r="4" fill="#d6453d" style="display:none"/>'+
    nodes+labels+
  '</svg>';
  _nowChartData={dayStart:dayStart,dayEnd:dayEnd,PXa:[padL,dayStart,plotW,dayEnd],axisY:axisY,padT:padT,pts:pts,evs:evs,W:W};
  _nowTick();
}

function _nowTick(){
  var host=document.getElementById('bNowChart');
  if(!host || !_nowChartData){ if(window._nowTimer){ clearInterval(window._nowTimer); window._nowTimer=null; } return; }
  var D=_nowChartData;
  var d=new Date(), nowMin=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
  function PX(m){ return D.PXa[0]+(m-D.PXa[1])/(D.PXa[3]-D.PXa[1])*D.PXa[2]; }
  var line=document.getElementById('nowLine'), marker=document.getElementById('nowMarker');
  var st=document.getElementById('nowStatus');
  var active=-1, prog=0;
  for(var i=0;i<D.evs.length;i++){ if(nowMin>=D.evs[i].min && nowMin<D.evs[i].end){ active=i; prog=(nowMin-D.evs[i].min)/(D.evs[i].end-D.evs[i].min); break; } }
  // reset nodes (cor base = cor do hub do evento)
  for(var j=0;j<D.pts.length;j++){ var c=document.getElementById('nowdot-'+j); if(!c) continue;
    if(j===active){ var col=_progColor(prog); c.setAttribute('fill',col); c.setAttribute('r','9'); c.classList.add('active'); c.style.filter='drop-shadow(0 0 6px '+col+')'; }
    else { c.setAttribute('fill',D.evs[j].color); c.setAttribute('r','6'); c.classList.remove('active'); c.style.filter='none'; }
  }
  // now-line
  if(nowMin>=D.dayStart && nowMin<=D.dayEnd){
    var x=PX(nowMin);
    if(line){ line.setAttribute('x1',x.toFixed(1)); line.setAttribute('x2',x.toFixed(1)); line.style.display=''; }
    if(marker){ marker.setAttribute('cx',x.toFixed(1)); marker.setAttribute('cy',D.axisY); marker.style.display=''; }
  } else { if(line) line.style.display='none'; if(marker) marker.style.display='none'; }
  // status badge
  if(!st) return;
  if(active>=0){
    var e=D.evs[active], col2=_progColor(prog);
    st.className='now-status live';
    st.style.background='color-mix(in srgb,'+col2+' 16%,transparent)'; st.style.color=col2;
    var tt=e.title.length>22?e.title.slice(0,21)+'…':e.title;
    st.innerHTML='<span class="sdot" style="background:'+col2+'"></span>'+t18('nowLive')+' · '+esc(tt);
  } else {
    var nextI=-1; for(var k=0;k<D.evs.length;k++){ if(D.evs[k].min>nowMin){ nextI=k; break; } }
    st.className='now-status';
    st.style.background='var(--bg)'; st.style.color='var(--text2)';
    if(nowMin>D.dayEnd){ st.textContent=t18('nowEnded'); }
    else if(nextI>=0){ var ne=D.evs[nextI]; var ntt=ne.title.length>20?ne.title.slice(0,19)+'…':ne.title; st.textContent=t18('nowNext')+': '+_fmtMin(ne.min)+' '+ntt; }
    else { st.textContent=t18('nowSoon'); }
  }
}

function _startCountdown(){

function _tickCountdown(){

  var days=Math.floor(diff/86400000);

  var mins=Math.floor(diff/60000)%60;
  var secs=Math.floor(diff/1000)%60;

function openSlotManager(){
  if(!WP_ENABLED) return;
  var rows='';
  for(var i=0;i<SLOTS.length;i++){
    var s=SLOTS[i];
    rows+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f1f3f4;">'+
      '<span style="font-size:14px;font-weight:600;min-width:52px;font-family:monospace;letter-spacing:1px;">'+esc(s.label)+'</span>'+
      '<span style="flex:1;font-size:12px;color:var(--text2);">'+allTalksInSlot(s.label)+' sessões</span>'+
      '<button class="btn" style="font-size:11px;padding:3px 8px" onclick="editSlot(\''+esc(s.label)+'\')">✏️ Editar</button>'+
      '<button class="btn btn-d" style="font-size:11px;padding:3px 8px" onclick="deleteSlot(\''+esc(s.label)+'\')">🗑</button></div>';
  }
  openModal('⏰ Gerenciar Horários',
    '<div style="max-height:300px;overflow-y:auto;margin-bottom:14px;">'+rows+'</div>'+
    '<div style="background:var(--bg);border-radius:8px;padding:12px;border:1px solid var(--border);">'+
    '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:8px;">ADICIONAR NOVO HORÁRIO</div>'+
    '<div style="display:flex;gap:8px;align-items:center;">'+
    '<input id="newSlotTime" class="fi" type="text" style="width:90px;font-family:monospace;text-align:center;font-size:15px;letter-spacing:2px;" placeholder="09:30" maxlength="5">'+
    '<button class="btn btn-p" onclick="addSlot()">+ Adicionar</button></div>'+
    '<div style="font-size:11px;color:var(--text2);margin-top:5px;">Digite HH:MM — ex: 09:30, 14:00</div></div>',
    '<button class="btn" onclick="closeModal()">Fechar</button>', false);
}
function allTalksInSlot(lbl){ var c=0; for(var d=0;d<NDAYS;d++) if(SCHEDULES[d][lbl]) c+=Object.keys(SCHEDULES[d][lbl]).length; return c; }
function addSlot(){
  var val=(document.getElementById('newSlotTime').value||'').trim();
  if(!val){ alert('Digite HH:MM'); return; }
  var parts=val.split(':');
  if(parts.length!==2){ alert('Use HH:MM, ex: 09:30'); return; }
  var hh=parseInt(parts[0],10),mm=parseInt(parts[1],10);
  if(isNaN(hh)||isNaN(mm)||hh<0||hh>23||mm<0||mm>59){ alert('Horário inválido.'); return; }
  var lbl=p2(hh)+':'+p2(mm);
  for(var i=0;i<SLOTS.length;i++) if(SLOTS[i].label===lbl){ alert('Já existe.'); return; }
  SLOTS.push({label:lbl,isBreak:false}); sortSlots(); ensureSlot(lbl); saveData(); renderMain(); openSlotManager();
}
function deleteSlot(lbl){
  var t=allTalksInSlot(lbl);
  if(!confirm(t>0?'Horário tem '+t+' sessões. Excluir?':'Excluir '+lbl+'?')) return;
  SLOTS=SLOTS.filter(function(s){return s.label!==lbl;});
  for(var d=0;d<NDAYS;d++) delete SCHEDULES[d][lbl];
  saveData(); renderMain(); openSlotManager();
}
function editSlot(old){
  var nv=prompt('Novo horário (HH:MM):',old); if(!nv||nv===old) return;
  var parts=nv.split(':');
  if(parts.length!==2||isNaN(parseInt(parts[0]))||isNaN(parseInt(parts[1]))){ alert('Formato inválido.'); return; }
  var nl=p2(parseInt(parts[0]))+':'+p2(parseInt(parts[1]));
  for(var i=0;i<SLOTS.length;i++) if(SLOTS[i].label===nl&&nl!==old){ alert('Já existe.'); return; }
  for(var i=0;i<SLOTS.length;i++) if(SLOTS[i].label===old){ SLOTS[i].label=nl; break; }
  for(var d=0;d<NDAYS;d++){
    if(SCHEDULES[d][old]){
      SCHEDULES[d][nl]=SCHEDULES[d][old];
      var rk=Object.keys(SCHEDULES[d][nl]);
      for(var j=0;j<rk.length;j++) SCHEDULES[d][nl][rk[j]].time=nl;
      delete SCHEDULES[d][old];
    }
  }
  sortSlots(); saveData(); renderMain(); openSlotManager();
}

function addHub(){

  if(!name){ alert('Digite o nome do Hub.'); return; }

function deleteHub(idx){
  var cnt = _countTalksWithHub(idx);
  if(!confirm((cnt>0?cnt+' sessões usam este Hub e ficarão sem Hub. ':'')+'Excluir "'+L(HUBS[idx])+'"?')) return;
  HUBS.splice(idx,1);
  HUB_COLORS.splice(idx,1);
  for(var d=0;d<NDAYS;d++){
    var slotKeys=Object.keys(SCHEDULES[d]);
    for(var si=0;si<slotKeys.length;si++){
      var rk=Object.keys(SCHEDULES[d][slotKeys[si]]);
      for(var ri=0;ri<rk.length;ri++){
        var t=SCHEDULES[d][slotKeys[si]][rk[ri]];
        if(!t) continue;
        var hi=parseInt(t.hub);
        if(hi===idx) t.hub='';
        else if(hi>idx) t.hub=String(hi-1);
      }
    }
  }
  renderLegend(); saveData(); renderMain();
  _renderHubRoomModal('hubs');
}

// ── Helpers ─────────────────────────────
function _colorToBg(hex){
  try{
    var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    var lr=Math.round(r+(255-r)*0.78), lg=Math.round(g+(255-g)*0.78), lb=Math.round(b+(255-b)*0.78);
    return '#'+lr.toString(16).padStart(2,'0')+lg.toString(16).padStart(2,'0')+lb.toString(16).padStart(2,'0');
  }catch(e){ return '#f4f4f5'; }
}
function _darken(hex){
  try{
    var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    var dr=Math.round(r*0.55), dg=Math.round(g*0.55), db=Math.round(b*0.55);
    return '#'+dr.toString(16).padStart(2,'0')+dg.toString(16).padStart(2,'0')+db.toString(16).padStart(2,'0');
  }catch(e){ return '#1a1a2e'; }
}
function _countTalksWithHub(idx){
  var c=0, si=String(idx);
  for(var d=0;d<NDAYS;d++){
    var sk=Object.keys(SCHEDULES[d]);
    for(var i=0;i<sk.length;i++){
      var rk=Object.keys(SCHEDULES[d][sk[i]]);
      for(var j=0;j<rk.length;j++){
        var t=SCHEDULES[d][sk[i]][rk[j]];
        if(t&&t.hub===si) c++;
      }
    }
  }
  return c;
}
function _countTalksInRoom(rid){
  var c=0;
  for(var d=0;d<NDAYS;d++){
    var sk=Object.keys(SCHEDULES[d]);
    for(var i=0;i<sk.length;i++) if(SCHEDULES[d][sk[i]][rid]) c++;
  }
  return c;
}

function toggleHub(idx){
  if(idx===-1){
    // TODOS: limpa todos os filtros de hub
    activeHubs={};
  } else {
    // Liga/desliga este hub; TODOS some automaticamente
    if(activeHubs[idx]) delete activeHubs[idx];
    else activeHubs[idx]=true;
  }
  renderLegend();
  renderMain();
}

function drawerToggleHub(idx){
  if(idx===-1){ activeHubs={}; }
  else { if(activeHubs[idx]) delete activeHubs[idx]; else activeHubs[idx]=true; }
  renderLegend();
  renderDrawer();
  renderMain();
}

var _gridZoom = 1;
var _gridZoomMin = 0.3;
var _gridZoomMax = 10;

function gridSetZoom(z){
  z = Math.round(z * 100) / 100;
  z = Math.max(_gridZoomMin, Math.min(_gridZoomMax, z));
  _gridZoom = z;
  var wrap = document.getElementById('gridZoomWrap');
  if(wrap) wrap.style.zoom = z;
  _updateZoomControls();
}

// Ajusta o nº de linhas do título de cada card da GRADE para nunca cortar
// texto: clampa para as linhas que cabem na altura do card e adiciona "…".
// Se o card for curto demais, oculta a linha de palestrantes para dar espaço.
function _fitCardTitles(){
  var cards=document.querySelectorAll('#agendaContent .card');
  for(var i=0;i<cards.length;i++){
    (function(card){
      var title=card.querySelector('.ctitle');
      if(!title) return;
      var spk=card.querySelector('.cspk-row');
      // reset
      title.style.webkitLineClamp=''; title.style.display=''; title.style.maxHeight='';
      if(spk) spk.style.display='';
      var lh=parseFloat(getComputedStyle(title).lineHeight)||16;
      function availForTitle(){
        var cs=getComputedStyle(card);
        var pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
        var gap=parseFloat(cs.rowGap||cs.gap||0)||0;
        var others=0,n=0;
        Array.prototype.forEach.call(card.children,function(ch){ n++; if(ch!==title && ch.offsetParent!==null) others+=ch.offsetHeight; });
        return card.clientHeight - pad - others - gap*Math.max(0,(n-1));
      }
      var a=availForTitle();
      var lines=Math.floor(a/lh);
      if(lines<1 && spk){ spk.style.display='none'; a=availForTitle(); lines=Math.floor(a/lh); }
      lines=Math.max(1,lines);
      title.style.display='-webkit-box';
      title.style.webkitBoxOrient='vertical';
      title.style.webkitLineClamp=String(lines);
      title.style.overflow='hidden';
      title.style.maxHeight=(lines*lh)+'px';
    })(cards[i]);
  }
}

function _gridInitPinch(){
  var wrap = document.getElementById('agendaContent');
  if(!wrap||wrap._pinchInit) return;
  wrap._pinchInit = true;
  var _pBase=null, _pZ=1;
  wrap.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      e.preventDefault();
      _pBase=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
      _pZ=_gridZoom;
    }
  },{passive:false});
  wrap.addEventListener('touchmove',function(e){
    if(e.touches.length===2&&_pBase){
      e.preventDefault();
      var dist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
      gridSetZoom(_pZ*(dist/_pBase));
    }
  },{passive:false});
  wrap.addEventListener('touchend',function(){_pBase=null;});
}

function renderCards(sc){
  document.getElementById('agendaContent').className='wrap list-mode';
  document.getElementById('stickyRoomHdr').style.display='none';
  document.getElementById('roomFilters').style.display='flex';
  var visRooms=ROOMS.filter(function(r){return !hiddenR[r.id];});
  var h='<div class="cgrid-wrap">';
  for(var si=0;si<SLOTS.length;si++){
    var slot=SLOTS[si]; if(slot.isBreak) continue;
    var hasAny=false;
    for(var ri=0;ri<visRooms.length;ri++){ if(sc[slot.label]&&sc[slot.label][visRooms[ri].id]&&matchQ(sc[slot.label][visRooms[ri].id])) hasAny=true; }
    if(!hasAny) continue;
    h+='<div class="cgrid-slot-group"><div class="cgrid-slot-time">'+slot.label+'</div><div class="cgrid-slot-cards">';
    for(var ri=0;ri<visRooms.length;ri++){
      var room=visRooms[ri], t=sc[slot.label]&&sc[slot.label][room.id];
      if(!t||!matchQ(t)) continue;
      var ts=talkStyle(t,room);
      var spkIds=t.speakerIds&&t.speakerIds.length?t.speakerIds:(t.speakerId?[t.speakerId]:[]);
      var spkAvatars='';
      var cgMax=2;
      for(var ai=0;ai<Math.min(spkIds.length,cgMax);ai++){
        var sp=findSpk(spkIds[ai]);
        var _rg=sp?catColor(sp):'var(--border)';
        spkAvatars+=sp&&sp.photo?'<img class="cgrid-av" style="border:2px solid '+_rg+';box-sizing:border-box;" src="'+sp.photo+'" alt="">':'<div class="cgrid-avini" style="background:'+avColor(sp?sp.name:(t.speakerName||''))+';border:2px solid '+_rg+';box-sizing:border-box;">'+initials(sp?sp.name:(t.speakerName||''))+'</div>';

var _ganttZoom = 1; // 1 = 100%, 2 = 200%, etc.
var _ganttZoomMin = 1;
var _ganttZoomMax = 10;
var _ganttZoomStep = 0.5;

function ganttSetZoom(z){
  z = Math.round(z * 10) / 10;
  z = Math.max(_ganttZoomMin, Math.min(_ganttZoomMax, z));
  _ganttZoom = z;

  var outer = document.getElementById('ganttOuter');
  var wrap  = document.getElementById('ganttWrap');
  if(!outer||!wrap){ _updateZoomControls(); return; }

  var scrollRatio = outer.scrollLeft / (outer.scrollWidth - outer.clientWidth || 1);
  wrap.style.setProperty('--gz', z);

  requestAnimationFrame(function(){
    var maxScroll = outer.scrollWidth - outer.clientWidth;
    outer.scrollLeft = scrollRatio * maxScroll;
    _updateZoomControls();
  });
}

function renderGantt(sc, vis){
  document.getElementById('agendaContent').className='wrap list-mode';
  document.getElementById('stickyRoomHdr').style.display='none';
  document.getElementById('roomFilters').style.display='flex';

  var allSlots=SLOTS.filter(function(s){return !s.isBreak;});
  var firstSlot=allSlots[0]?allSlots[0].label:'08:00';
  var lastSlot=allSlots[allSlots.length-1]?allSlots[allSlots.length-1].label:'20:00';
  function toMin(t){ var p=t.split(':'); return parseInt(p[0])*60+parseInt(p[1]); }
  var dayStart=toMin(firstSlot), dayEnd=toMin(lastSlot)+30, totalMin=dayEnd-dayStart;

  // Ticks: horas cheias apenas (menos ruído no mobile)
  var rulerTicks=[];
  for(var i=0;i<allSlots.length;i++){
    if(allSlots[i].label.split(':')[1]==='00') rulerTicks.push(allSlots[i].label);
  }
  if(!rulerTicks.length||rulerTicks[0]!==firstSlot) rulerTicks.unshift(firstSlot);

  function pct(min){ return ((min-dayStart)/totalMin*100).toFixed(3)+'%'; }

  // ── Régua ──
  var ticksHtml='';
  for(var ri=0;ri<rulerTicks.length;ri++){
    ticksHtml+='<div class="gantt-tick" style="left:'+pct(toMin(rulerTicks[ri]))+'"><span>'+rulerTicks[ri]+'</span></div>';
  }

  // ── Linhas de sala ──
  var rowsHtml='';
  for(var vi=0;vi<vis.length;vi++){
    var room=vis[vi];
    var trackTicksHtml='';
    for(var ti=0;ti<rulerTicks.length;ti++)
      trackTicksHtml+='<div class="gantt-track-tick" style="left:'+pct(toMin(rulerTicks[ti]))+'"></div>';

    var barsHtml='';
    var slotKeys=Object.keys(sc);
    for(var si2=0;si2<slotKeys.length;si2++){
      var t=sc[slotKeys[si2]][room.id];
      if(!t||!matchQ(t)) continue;
      var ts=talkStyle(t,room);
      var barStart=toMin(t.time||slotKeys[si2]), barEnd=barStart+talkDur(t);
      var spkIds=t.speakerIds&&t.speakerIds.length?t.speakerIds:(t.speakerId?[t.speakerId]:[]);
      var avHtml='';
      if(spkIds.length){
        var sp=findSpk(spkIds[0]);
        if(sp&&sp.photo) avHtml='<img class="gantt-av" src="'+sp.photo+'" alt="">';
        else avHtml='<div class="gantt-av-ini" style="background:'+avColor(sp?sp.name:(t.speakerName||''))+'">'+initials(sp?sp.name:(t.speakerName||''))+'</div>';
      }
      if(spkIds.length>1) avHtml+='<div class="gantt-av-more">+'+(spkIds.length-1)+'</div>';
      barsHtml+='<div class="gantt-bar '+ts.cls+'" style="left:'+pct(barStart)+';width:'+((barEnd-barStart)/totalMin*100).toFixed(3)+'%;background:'+ts.bg+';border-left-color:'+ts.color+';color:'+_darken(ts.color)+';" '+
        'onclick="openTalkDetail(\''+esc(t.id)+'\')" title="'+esc(L(t.title))+'">'+
        '<div class="gantt-bar-inner">'+
        (avHtml?'<div class="gantt-bar-avs">'+avHtml+'</div>':'')+
        '<span class="gantt-bar-title">'+esc(L(t.title))+'</span>'+
        '</div></div>';
    }

    rowsHtml+='<div class="gantt-row">'+
      '<div class="gantt-label">'+
        '<span class="gantt-label-dot" style="background:var(--text2)"></span>'+
        '<span class="gantt-label-name" style="color:var(--text2)">'+esc(RN(room.name))+'</span>'+
      '</div>'+
      '<div class="gantt-track">'+trackTicksHtml+barsHtml+'</div>'+
      '</div>';
  }

  var gz = _ganttZoom;
  var atMin = gz <= _ganttZoomMin, atMax = gz >= _ganttZoomMax;

  document.getElementById('agendaContent').innerHTML=
    '<div class="gantt-outer" id="ganttOuter">'+
      '<div class="gantt-wrap" id="ganttWrap" style="--gz:'+gz+'">'+
        '<div class="gantt-ruler" id="ganttRuler">'+
          '<div class="gantt-ruler-inner">'+ticksHtml+'</div>'+
        '</div>'+
        '<div class="gantt-rows">'+rowsHtml+'</div>'+
      '</div>'+
    '</div>';

  _ganttInitPinch();
  _updateZoomControls();
}

function _ganttInitPinch(){
  var outer = document.getElementById('ganttOuter');
  if(!outer) return;
  var _pBase=null, _pZ=1;
  outer.addEventListener('touchstart', function(e){
    if(e.touches.length===2){
      e.preventDefault();
      _pBase = Math.hypot(e.touches[1].clientX-e.touches[0].clientX, e.touches[1].clientY-e.touches[0].clientY);
      _pZ = _ganttZoom;
    }
  },{passive:false});
  outer.addEventListener('touchmove', function(e){
    if(e.touches.length===2 && _pBase){
      e.preventDefault();
      var dist = Math.hypot(e.touches[1].clientX-e.touches[0].clientX, e.touches[1].clientY-e.touches[0].clientY);
      var newZ = _pZ * (dist/_pBase);
      ganttSetZoom(newZ);
    }
  },{passive:false});
  outer.addEventListener('touchend', function(){ _pBase=null; });
}

function buildSearchDrop(q, dropId){
  var drop = document.getElementById(dropId);
  if(!drop) return;
  if(!q){ drop.classList.remove('on'); drop.innerHTML=''; return; }

  // 1) Participantes que batem (nome, cargo, empresa)
  var spkResults = [];
  for(var sp=0;sp<SPEAKERS.length;sp++){
    var s=SPEAKERS[sp];
    if(((s.name||'').toLowerCase().indexOf(q)>-1) ||
       ((s.role||'').toLowerCase().indexOf(q)>-1) ||
       ((s.company||'').toLowerCase().indexOf(q)>-1)){
      spkResults.push(s);
    }
    if(spkResults.length>=6) break;
  }

  // 2) Sessões que batem (título ou nome do participante)
  var results = [];
  for(var d=0;d<NDAYS;d++){
    var sc = SCHEDULES[d], slotKeys = Object.keys(sc);
    for(var si=0;si<slotKeys.length;si++){
      var slotObj = sc[slotKeys[si]], roomKeys = Object.keys(slotObj);
      for(var ri=0;ri<roomKeys.length;ri++){
        var t = slotObj[roomKeys[ri]];
        if(!t||!t.id) continue;
        if(String(L(t.title)||'').toLowerCase().indexOf(q)<0 && (t.speakerName||'').toLowerCase().indexOf(q)<0) continue;
        var room = null;
        for(var rr=0;rr<ROOMS.length;rr++) if(ROOMS[rr].id===roomKeys[ri]){ room=ROOMS[rr]; break; }
        results.push({talk:t, room:room||{}, day:d, slot:slotKeys[si]});
        if(results.length>=12) break;
      }
      if(results.length>=12) break;
    }
    if(results.length>=12) break;
  }

  drop.innerHTML = '';
  if(!spkResults.length && !results.length){
    var empty = document.createElement('div');
    empty.className = 'srch-empty';
    empty.textContent = t18('noSearchResults').replace('%s', q);
    drop.appendChild(empty);
    drop.classList.add('on');
    return;
  }

  function addHeader(txt){
    var hd=document.createElement('div'); hd.className='srch-head'; hd.textContent=txt; drop.appendChild(hd);
  }

  // —— Participantes ——
  if(spkResults.length){
    addHeader(t18('speakers'));
    for(var i=0;i<spkResults.length;i++){
      var s=spkResults[i];
      var item=document.createElement('div');
      item.className='srch-item';
      item.dataset.spkId=s.id;
      item.addEventListener('mousedown', function(e){ e.preventDefault(); openSpeakerResult(this.dataset.spkId); });

      var ring=catColor(s);
      var av=document.createElement('div');
      av.className='srch-av';
      av.style.border='2px solid '+ring;
      if(s.photo){ var im=document.createElement('img'); im.src=s.photo; av.appendChild(im); }
      else { av.style.background=avColor(s.name); av.textContent=initials(s.name); av.classList.add('ini'); }

      var info=document.createElement('div'); info.className='srch-info';
      var nm=document.createElement('div'); nm.className='srch-title'; nm.textContent=s.name||'';
      var mt=document.createElement('div'); mt.className='srch-meta';
      mt.textContent=[s.role,s.company].filter(Boolean).join(' · ')||catName(s.category||'speaker');
      info.appendChild(nm); info.appendChild(mt);

      var badge=document.createElement('div'); badge.className='srch-badge';
      badge.style.background='color-mix(in srgb,'+ring+' 16%,transparent)'; badge.style.color=ring;
      badge.textContent=catName(s.category||'speaker');

      item.appendChild(av); item.appendChild(info); item.appendChild(badge);
      drop.appendChild(item);
    }
  }

  // —— Sessões ——
  if(results.length){
    addHeader(t18('talks'));
    for(var j=0;j<results.length;j++){
      var r = results[j];
      var item2 = document.createElement('div');
      item2.className = 'srch-item';
      item2.dataset.talkId  = r.talk.id;
      item2.addEventListener('mousedown', function(e){ e.preventDefault(); openSearchResult(this.dataset.talkId); });

      var dot = document.createElement('div');
      dot.className = 'srch-dot';
      var _ts=talkStyle(r.talk,r.room);
      dot.style.background = _ts.color || '#999';

      var info2 = document.createElement('div');
      info2.className = 'srch-info';
      var titleEl = document.createElement('div');
      titleEl.className = 'srch-title';
      titleEl.textContent = L(r.talk.title) || '';
      var metaEl = document.createElement('div');
      metaEl.className = 'srch-meta';
      metaEl.textContent = (DAY_SHORT[r.day]||('Dia '+(r.day+1))) + ' · ' + r.slot + (r.talk.speakerName ? ' · 🎤 ' + r.talk.speakerName : '');
      info2.appendChild(titleEl);
      info2.appendChild(metaEl);

      var badge2 = document.createElement('div');
      badge2.className = 'srch-badge';
      badge2.style.background = _ts.bg || '#eee';
      badge2.style.color = _ts.color || '#333';
      badge2.textContent = RN(r.room.name) || '';

      item2.appendChild(dot);
      item2.appendChild(info2);
      item2.appendChild(badge2);
      drop.appendChild(item2);
    }
  }
  drop.classList.add('on');
}

function addToGoogleCalendar(id){
  var found=findTalk(id); if(!found) return;
  var t=found.talk, room=found.room, day=t.day!==undefined?t.day:curDay, date=GCAL_DATES[day];
  function gct(lbl,dt){ var p=lbl.split(':'); return dt+'T'+p2(parseInt(p[0]))+p2(parseInt(p[1]))+'00'; }
  var start=gct(t.time,date), end=gct(addM(t.time,talkDur(t)),date);
  var locStr = (L(t.locText)||'')||(room.name+' — Latimpacto');
  var pLabel = (LANG==='en'?'Speaker: ':(LANG==='es'?'Ponente: ':'Palestrante: '));
  var lLabel = (LANG==='en'?'Location: ':(LANG==='es'?'Lugar: ':'Local: '));
  var evName = 'Latimpacto';
  var titleStr = L(t.title) || evName;
  var descTxt = L(t.desc);
  var desc=(t.speakerName?pLabel+t.speakerName:'')+(descTxt?(t.speakerName?'\n\n':'')+descTxt:'')+'\n\n'+lLabel+evName;
  var params='action=TEMPLATE'
    +'&text='+encodeURIComponent(titleStr)
    +'&dates='+start+'/'+end
    +'&details='+encodeURIComponent(desc)
    +'&location='+encodeURIComponent(locStr)
    +'&sf=true&output=xml';
  var webUrl='https://calendar.google.com/calendar/render?'+params;

  // Detecta mobile
  var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(!isMobile){ window.open(webUrl,'_blank'); return; }

  // iOS — tenta abrir o app via URL scheme; fallback para web após 1.5s
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
    var iosUrl='googlecalendar://calendar.google.com/calendar/render?'+params;
    var fallbackTimer=setTimeout(function(){ window.open(webUrl,'_blank'); },1500);
    var iframe=document.createElement('iframe');
    iframe.style.display='none';
    iframe.src=iosUrl;
    document.body.appendChild(iframe);
    setTimeout(function(){ document.body.removeChild(iframe); },3000);
    // Se a página perder foco, o app abriu — cancela o fallback
    window.addEventListener('blur',function onBlur(){
      clearTimeout(fallbackTimer);
      window.removeEventListener('blur',onBlur);
    },{once:true});
    return;
  }

  // Android — intent:// com fallback para web
  var intentUrl='intent://calendar.google.com/calendar/render?'+params
    +'#Intent;scheme=https;package=com.google.android.calendar;S.browser_fallback_url='
    +encodeURIComponent(webUrl)+';end';
  window.location.href=intentUrl;
}

function deleteTalk(id){
  if(!WP_ENABLED) return;
  if(!confirm('Excluir esta sessão?')) return;
  var _dt=findTalk(id);
  function _removeLocal(){
    for(var d=0;d<NDAYS;d++){
      var slots=Object.keys(SCHEDULES[d]);
      for(var si=0;si<slots.length;si++){
        var slotObj=SCHEDULES[d][slots[si]], rooms=Object.keys(slotObj);
        for(var ri=0;ri<rooms.length;ri++){
          if(slotObj[rooms[ri]] && slotObj[rooms[ri]].id===id) delete slotObj[rooms[ri]];
        }
      }
    }
  }
  // Com backend: só remove da tela DEPOIS que o servidor confirma a exclusão.
  // Antes a exclusão era disparada sem await e sem tratar erro — se falhasse,
  // a sessão sumia localmente mas voltava ao recarregar (vinha do banco).
  if(window.SB && SB.enabled){
    SB.deleteTalk(id).then(function(){
      _removeLocal();
      closeModal();
      logAction('Excluiu a sessão', _dt&&_dt.talk?L(_dt.talk.title):'');
      renderMain();
    }).catch(function(err){
      alert('Não foi possível excluir a sessão: ' + ((err&&err.message)||String(err||'')));
    });
    return;
  }
  _removeLocal();
  closeModal();
  logAction('Excluiu a sessão', _dt&&_dt.talk?L(_dt.talk.title):'');
  saveData();
  renderMain();
}

function saveTalk(){
  if(!WP_ENABLED && !confirm('Token WordPress não configurado. A sessão será salva apenas localmente e poderá ser perdida ao recarregar a página. Continuar?')) return;
  var titleObj=_mlRead('evTitle'); var title=titleObj.pt||titleObj.en||titleObj.es;
  if(!title){ alert('Preencha o título (ao menos um idioma).'); return; }

  var day    = parseInt(document.getElementById('evDay').value,10);
  var time   = document.getElementById('evTime').value;
  var room   = document.getElementById('evRoom').value;
  var descObj=_mlRead('evDesc');
  var hub    = document.getElementById('evHub').value;
  var format = document.getElementById('evFormat').value;
  var libras  = document.getElementById('evLibras').checked;
  var traducao= document.getElementById('evTrad').checked;
  var duration = Math.max(15, parseInt(document.getElementById('evDuration').value||'30', 10)||30);

  // Valida dia
  if(isNaN(day) || day < 0 || day >= NDAYS){ alert('Dia inválido.'); return; }
  // Garante que o slot de início existe
  var slotExists = false;
  for(var si=0;si<SLOTS.length;si++) if(SLOTS[si].label===time){ slotExists=true; break; }
  if(!slotExists){ SLOTS.push({label:time, isBreak:false}); sortSlots(); }

  // Slot de fim: só insere se for múltiplo de 30min (ex: 10:00, 10:30, 11:00...)
  // Slots quebrados (ex: 10:02) não precisam existir — o card usa posição absoluta
  var endTime = addM(time, duration);
  var endMin = (function(){ var p=endTime.split(':'); return parseInt(p[0])*60+parseInt(p[1]); })();
  if(endMin % 30 === 0){
    var endSlotExists = false;
    for(var si=0;si<SLOTS.length;si++) if(SLOTS[si].label===endTime){ endSlotExists=true; break; }
    if(!endSlotExists){ SLOTS.push({label:endTime, isBreak:false}); sortSlots(); }
  }

  for(var _d=0;_d<NDAYS;_d++){ if(!SCHEDULES[_d][time]) SCHEDULES[_d][time]={}; }

  // Verifica conflito: outra sessão já nesse slot+sala (exceto ela mesma se for edição)
  var existing = SCHEDULES[day][time][room];
  if(existing && existing.id !== editTalkId){
    if(!confirm('Já existe uma sessão neste horário e sala. Substituir?')) return;
  }

  // Monta nomes dos palestrantes
  var spkNames = [];
  for(var i=0;i<pickedSpks.length;i++){
    var s=findSpk(pickedSpks[i]); if(s) spkNames.push(s.name);
  }

  var locText = (document.getElementById('evLocText') ? document.getElementById('evLocText').value.trim() : '');
  var locImg  = _locImgData || (document.getElementById('locImgPrev') && document.getElementById('locImgPrev').src && document.getElementById('locImgPrev').style.display!=='none' ? document.getElementById('locImgPrev').src : '');
  _locImgData = null; // reset

  // ── Auto-tradução: preenche idiomas vazios do título/descrição e só então
  //    finaliza a gravação. Botão mostra "Traduzindo…" enquanto trabalha. ──
  var _sb=document.querySelector('#mFtr .btn-p'); var _sbtxt=_sb?_sb.textContent:'';
  if(_sb){ _sb.disabled=true; _sb.textContent='Traduzindo…'; }
  Promise.all([_autoFillML(titleObj), _autoFillML(descObj)]).then(function(){
    if(_sb){ _sb.disabled=false; _sb.textContent=_sbtxt; }
    _finishSaveTalk(titleObj, title, descObj, day, time, room, hub, format, libras, traducao, duration, spkNames, locText, locImg);
  });
}

function _finishSaveTalk(titleObj, title, descObj, day, time, room, hub, format, libras, traducao, duration, spkNames, locText, locImg){
  // Monta objeto da sessão — preserva id existente em edição
  var talkId = editTalkId || makeId('t');
  var obj = {
    id: talkId, title: titleObj, room: room, time: time, day: day,
    duration: duration,
    desc: descObj, hub: hub, format: format, libras: libras, traducao: traducao,
    speakerIds: pickedSpks.slice(),
    speakerId:  pickedSpks[0]||null,
    speakerName: spkNames.join(', '),
    locText: locText, locImg: locImg
  };

  // Se for edição, remove a sessão do local ANTERIOR primeiro
  // (pode ter mudado de dia/slot/sala)
  if(editTalkId){
    for(var d=0;d<NDAYS;d++){
      var slots = Object.keys(SCHEDULES[d]);
      for(var si=0;si<slots.length;si++){
        var slotObj = SCHEDULES[d][slots[si]];
        var rooms   = Object.keys(slotObj);
        for(var ri=0;ri<rooms.length;ri++){
          if(slotObj[rooms[ri]] && slotObj[rooms[ri]].id === editTalkId){
            delete slotObj[rooms[ri]];
          }
        }
      }
    }
  }

  // Garante que o slot destino existe
  if(!SCHEDULES[day][time]) SCHEDULES[day][time] = {};

  // Insere sessão no novo local
  SCHEDULES[day][time][room] = obj;

  // Muda para o dia da sessão e salva
  _setActiveDay(day);

  // Tira snapshot ANTES do closeModal
  var snapshot = JSON.parse(JSON.stringify({speakers:SPEAKERS,schedules:SCHEDULES,slots:SLOTS}));

  closeModal();
  renderMain();

  if(window.SB && SB.enabled){ SB.upsertTalk(obj); } else { saveData(); }
  logAction(editTalkId?'Editou a sessão':'Criou a sessão', title);
}

var cropState = null;

// Passo 1: usuário escolhe arquivo → pré-reduz se necessário → abre modal
function handlePhoto(inp){
  var f=inp.files[0]; if(!f) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var original=new Image();
    original.onload=function(){
      var MAX=1200; // reduz para no máximo 1200px no lado maior antes do crop
      var ow=original.naturalWidth, oh=original.naturalHeight;
      var scale=(ow>MAX||oh>MAX) ? MAX/Math.max(ow,oh) : 1;
      var cw=Math.round(ow*scale), ch=Math.round(oh*scale);
      var c=document.createElement('canvas'); c.width=cw; c.height=ch;
      c.getContext('2d').drawImage(original,0,0,cw,ch);
      // Guarda como WebP já pré-reduzida
      var reduced=c.toDataURL('image/webp',0.9);
      if(reduced.indexOf('data:image/webp')<0) reduced=c.toDataURL('image/jpeg',0.9);
      openCropModal(reduced, cw, ch);
    };
    original.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

// Passo 2: abre modal de crop com a imagem já pré-reduzida
function openCropModal(src, natW, natH){
  var SIZE=240; // diâmetro do círculo no preview (px)

  cropState=null; // reset

  var body=
    '<div style="text-align:center;margin-bottom:8px;font-size:13px;color:var(--text2);">'+
    'Arraste para reposicionar · use o zoom para ajustar</div>'+
    '<div id="cropWrap" style="width:100%;height:280px;position:relative;overflow:hidden;background:#1a1a1a;border-radius:8px;cursor:move;"'+
      ' onmousedown="cropDragStart(event)" onmousemove="cropDragMove(event)" onmouseup="cropDragEnd()" onmouseleave="cropDragEnd()"'+
      ' ontouchstart="cropTouchStart(event)" ontouchmove="cropTouchMove(event)" ontouchend="cropDragEnd()">'+
      '<canvas id="cropCanvas" style="position:absolute;top:0;left:0;"></canvas>'+
      '<div style="position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;">'+
        '<div style="width:'+SIZE+'px;height:'+SIZE+'px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.6);"></div>'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;align-items:center;gap:8px;margin-top:10px;">'+
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>'+
      '<input type="range" id="cropZoom" min="100" max="400" value="100" oninput="cropZoomChange(this.value)" style="flex:1;accent-color:var(--blue);">'+
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>'+
    '</div>';

  openModal('✂️ Ajustar Foto', body,
    '<button class="btn" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-p" onclick="cropConfirm()">✔ Usar esta posição</button>', false);

  // Carrega imagem e inicializa depois do layout estar pronto
  var img=new Image();
  img.onload=function(){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        var wrap=document.getElementById('cropWrap'); if(!wrap) return;
        var WW=wrap.offsetWidth, WH=wrap.offsetHeight;

        // Escala inicial: imagem preenchendo o círculo pelo lado menor
        var scaleToFill = SIZE / Math.min(natW, natH);

        cropState={
          img:img,
          natW:natW, natH:natH,
          SIZE:SIZE,
          WW:WW, WH:WH,
          // posição do canto sup-esq da imagem renderizada (em px do wrap)
          // inicia centralizada
          x: WW/2 - natW*scaleToFill/2,
          y: WH/2 - natH*scaleToFill/2,
          scale: scaleToFill,        // px por pixel da imagem
          baseScale: scaleToFill,    // escala mínima (100% do slider)
          dragging:false, lastX:0, lastY:0
        };

        _cropDraw();
      });
    });
  };
  img.src=src;
}

// Desenha a imagem no canvas interno
function _cropDraw(){
  var s=cropState; if(!s) return;
  var wrap=document.getElementById('cropWrap');
  var canvas=document.getElementById('cropCanvas'); if(!canvas) return;
  canvas.width=s.WW; canvas.height=s.WH;
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,s.WW,s.WH);
  ctx.drawImage(s.img, s.x, s.y, s.natW*s.scale, s.natH*s.scale);
}

function cropZoomChange(v){
  if(!cropState) return;
  var newScale = cropState.baseScale * (parseFloat(v)/100);
  // Zoom a partir do centro do wrap
  var cx=cropState.WW/2, cy=cropState.WH/2;
  var ratio=newScale/cropState.scale;
  cropState.x = cx - (cx-cropState.x)*ratio;
  cropState.y = cy - (cy-cropState.y)*ratio;
  cropState.scale=newScale;
  _cropDraw();
}

function cropDragStart(e){
  if(!cropState) return; e.preventDefault();
  cropState.dragging=true;
  cropState.lastX=e.touches?e.touches[0].clientX:e.clientX;
  cropState.lastY=e.touches?e.touches[0].clientY:e.clientY;
}
function cropDragMove(e){
  if(!cropState||!cropState.dragging) return; e.preventDefault();
  var cx=e.touches?e.touches[0].clientX:e.clientX;
  var cy=e.touches?e.touches[0].clientY:e.clientY;
  cropState.x+=cx-cropState.lastX; cropState.y+=cy-cropState.lastY;
  cropState.lastX=cx; cropState.lastY=cy;
  _cropDraw();
}
function cropDragEnd(){ if(cropState) cropState.dragging=false; }
function cropTouchStart(e){ cropDragStart(e); }
function cropTouchMove(e){ cropDragMove(e); }

// Passo 3: exporta a região do círculo como WebP 400×400, comprimido
function cropConfirm(){
  if(!cropState) return;
  var s=cropState;

  // Centro e raio do círculo no wrap
  var cx=s.WW/2, cy=s.WH/2, r=s.SIZE/2;

  // Coordenadas do círculo em pixels da imagem ORIGINAL
  var srcX=(cx-r-s.x)/s.scale;
  var srcY=(cy-r-s.y)/s.scale;
  var srcS=s.SIZE/s.scale; // tamanho do quadrado a capturar (em px da imagem)

  var OUT=400;
  var canvas=document.createElement('canvas');
  canvas.width=OUT; canvas.height=OUT;
  var ctx=canvas.getContext('2d');
  // Clip circular
  ctx.beginPath(); ctx.arc(OUT/2,OUT/2,OUT/2,0,Math.PI*2); ctx.clip();
  // Desenha a região selecionada escalada para 400×400
  ctx.drawImage(s.img, srcX, srcY, srcS, srcS, 0, 0, OUT, OUT);

  // Exporta como WebP, comprime iterativamente se >500KB
  function compress(quality){
    var url=canvas.toDataURL('image/webp', quality);
    if(url.indexOf('data:image/webp')<0) url=canvas.toDataURL('image/jpeg', quality);
    var kb=Math.round(url.length*0.75/1024);
    if(kb>500 && quality>0.3){
      setTimeout(function(){ compress(quality-0.1); }, 0);
    } else {
      photoData=url;
      closeModal();
      setTimeout(function(){ openSpkFormWithPhoto(editSpkId, photoData); }, 100);
    }
  }
  compress(0.88);
}

function doExport(){
  if(!WP_ENABLED) return;
  var csv='Dia,Horário,Sala,Título,Palestrante,Cargo,Empresa,Descrição\n';
  for(var d=0;d<NDAYS;d++) for(var si=0;si<SLOTS.length;si++){
    if(SLOTS[si].isBreak) continue;
    var sl=SCHEDULES[d][SLOTS[si].label]; if(!sl) continue;
    for(var ri=0;ri<ROOMS.length;ri++){ var t=sl[ROOMS[ri].id]; if(!t) continue; var spk=findSpk(t.speakerId)||{}; csv+='"'+DAY_LABELS[d]+'","'+SLOTS[si].label+'","'+ROOMS[ri].name+'","'+String(L(t.title)).replace(/"/g,'""')+'","'+(t.speakerName||'')+'","'+(spk.role||'')+'","'+(spk.company||'')+'","'+String(L(t.desc)||'').replace(/"/g,'""')+'"\n'; }
  }
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})); a.download='agenda_impactamais_2026.csv'; a.click();
}

function findSpk(id){ if(!id) return null; for(var i=0;i<SPEAKERS.length;i++) if(SPEAKERS[i].id===id) return SPEAKERS[i]; return null; }
function findTalk(id){
  for(var d=0;d<NDAYS;d++){ var dk=Object.keys(SCHEDULES[d]); for(var i=0;i<dk.length;i++){ var sl=SCHEDULES[d][dk[i]],rk=Object.keys(sl); for(var j=0;j<rk.length;j++) if(sl[rk[j]].id===id){ var room=null; for(var ri=0;ri<ROOMS.length;ri++) if(ROOMS[ri].id===rk[j]) room=ROOMS[ri]; return {talk:sl[rk[j]],room:room}; } } }
  return null;
}

// Conta sessões em um objeto schedules (aceita array ou objeto com chaves "0","1")
function _countTalks(schedules){
  var total = 0;
  if(!schedules || typeof schedules !== 'object') return 0;
  var days = Array.isArray(schedules) ? schedules : [schedules['0']||{}, schedules['1']||{}];
  for(var d=0;d<days.length;d++){
    var day = days[d]||{}, slots = Object.keys(day);
    for(var i=0;i<slots.length;i++) total += Object.keys(day[slots[i]]||{}).length;
  }
  return total;
}

// Normaliza schedules para sempre ser um array [day0, day1]
// NÃO usa emptyDay() pois SLOTS pode ainda não estar atualizado
function _normalizeSchedules(schedules){
  var ns=[]; for(var dd=0;dd<NDAYS;dd++) ns.push({});
  if(!schedules || typeof schedules!=='object') return ns;
  for(var d2=0;d2<NDAYS;d2++){
    var src = Array.isArray(schedules) ? (schedules[d2]||{}) : (schedules[String(d2)]||{});
    var ks=Object.keys(src); for(var i=0;i<ks.length;i++) ns[d2][ks[i]]=src[ks[i]];
  }
  return ns;
}

// Aplica dados vindos do servidor.
// Servidor é autoritativo: presença do campo (mesmo array vazio) = aplicar.
function _applyServerData(d){
  if(Array.isArray(d.slots))     SLOTS      = d.slots;
  if(Array.isArray(d.speakers))  SPEAKERS   = d.speakers;
  if(d.schedules !== undefined && d.schedules !== null) SCHEDULES  = _normalizeSchedules(d.schedules);
  if(Array.isArray(d.hubs))      HUBS       = d.hubs;
  if(Array.isArray(d.hubColors)) HUB_COLORS = d.hubColors;
  if(Array.isArray(d.rooms))     ROOMS      = d.rooms;
  if(d.highlights && typeof d.highlights==='object') HIGHLIGHTS = d.highlights;
  if(Array.isArray(d.categories) && d.categories.length) SPK_CATEGORIES = d.categories;
}

// Se o usuário fechar a aba antes do debounce de 300ms expirar, dispara o save
// pendente IMEDIATAMENTE usando sendBeacon (assíncrono, não-bloqueante).
// Sem isso, criar um palestrante e fechar a aba rápido perderia a edição.
// persistência é síncrona em saveData() — beacon de servidor não é necessário

function _doSaveWP(snapshot, attempt){
  showSaveIndicator('saving');

  // Garante que schedules é sempre um array [day0, day1]
  var sc0 = snapshot.schedules[0] || snapshot.schedules['0'] || {};
  var sc1 = snapshot.schedules[1] || snapshot.schedules['1'] || {};

  // Conta sessões para log
  var talkCount = 0;
  var countDay = function(day){
    var slots = Object.keys(day||{});
    for(var i=0;i<slots.length;i++){
      var rooms = Object.keys(day[slots[i]]||{});
      for(var j=0;j<rooms.length;j++){
        var t = day[slots[i]][rooms[j]];
        if(t && t.id) talkCount++;
      }
    }
  };
  countDay(sc0); countDay(sc1);

  var payload = {
    speakers:  snapshot.speakers,
    schedules: [sc0, sc1],
    slots:     snapshot.slots,
    hubs:      snapshot.hubs,
    hubColors: snapshot.hubColors,
    rooms:     snapshot.rooms
  };
  var bodyStr = JSON.stringify(payload);
  console.log('[Agenda] Enviando — palestrantes:'+snapshot.speakers.length+' sessões:'+talkCount+' bytes:'+bodyStr.length);

  return fetch(WP_API_BASE+'/wp-json/agenda/v1/save', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Agenda-Token':WP_TOKEN},
    body: bodyStr
  })
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(res){
    if(res.success){
      console.log('[Agenda] ✅ Salvo — palestrantes:'+(res.speakers||'?')+' sessões:'+(res.talks||'?'));

      // Se o servidor retornou erros de foto, exibe na UI + console
      if(res.photo_errors && res.photo_errors.length > 0){
        console.warn('[Agenda] ⚠️ Fotos com problema:', res.photo_errors);
        var names = res.photo_errors.map(function(e){ return (e.name||e.id)+': '+e.error; }).join('\n');
        showSaveIndicator('error', 'Salvo, mas '+res.photo_errors.length+' foto(s) falharam — veja o console');
        // Alerta visível apenas na primeira ocorrência, para não ser irritante
        if(!_doSaveWP._photoWarned){
          _doSaveWP._photoWarned = true;
          setTimeout(function(){
            alert('⚠️ O servidor não conseguiu salvar a(s) foto(s):\n\n'+names+'\n\nVerifique o log do WordPress (debug.log) para mais detalhes.');
          }, 100);
        }
      } else {
        showSaveIndicator('saved');
      }
    } else {
      throw new Error(res.message||'success=false');
    }
  })
  .catch(function(e){
    console.error('[Agenda] ❌ Falha ao salvar (tentativa '+(attempt+1)+'): '+e.message);
    if(attempt < 3){
      return new Promise(function(resolve){
        setTimeout(function(){ resolve(_doSaveWP(snapshot, attempt+1)); }, 4000);
      });
    }
    showSaveIndicator('error', 'Falha ao salvar — verifique conexão');
  });
}

function doDownloadBackup(filename){
  var payload = {
    _version: 2,
    _exported: new Date().toISOString(),
    speakers: SPEAKERS,
    schedules: SCHEDULES,
    slots: SLOTS,
    hubs: HUBS,
    hubColors: HUB_COLORS,
    rooms: ROOMS,
    days: DAYS,
    highlights: HIGHLIGHTS,
    categories: getCategories()
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
}

function doRestoreBackup(input){
  var file = input.files[0]; if(!file) return;
  var st   = document.getElementById('restoreStatus');
  st.style.display='block'; st.style.color='#f9ab00'; st.textContent='⏳ Lendo arquivo…';
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var data = JSON.parse(ev.target.result);
      if(!data.speakers || !data.schedules || !data.slots){
        st.style.color='#d93025'; st.textContent='❌ Arquivo inválido — não é um backup desta agenda.'; return;
      }
      if(!confirm('⚠️ Isso substitui TODOS os dados atuais pelo backup selecionado. Confirmar?')){
        st.style.display='none'; return;
      }
      _applyServerData(data);
      _rerender();
      updateDayTabs();
      if(window.SB && SB.enabled){
        st.style.color='var(--text2)'; st.textContent='⏳ Enviando backup ao servidor… aguarde.';
        SB.restoreAll(data).then(function(){
          logAction('Restaurou um backup completo');
          st.style.color='#0f9d58'; st.textContent='✅ Backup restaurado e salvo no servidor!';
          setTimeout(function(){ closeModal(); }, 1600);
        }).catch(function(err){
          st.style.color='#d93025'; st.textContent='❌ Erro ao enviar ao servidor: '+(err&&err.message||err);
        });
      } else {
        saveData();
        logAction('Restaurou um backup completo');
        st.style.color='#0f9d58'; st.textContent='✅ Backup restaurado!';
        setTimeout(function(){ closeModal(); }, 1600);
      }
    }catch(err){
      st.style.color='#d93025'; st.textContent='❌ Erro ao ler arquivo: '+err.message;
    }
  };
  reader.readAsText(file);
}

function clearAllData(){
  if(!WP_ENABLED) return;
  if(!confirm('⚠️ Apagar TODOS os dados?')) return;

  function _resetLocalAndRender(){
    SPEAKERS=[];
    SCHEDULES=(function(){var a=[];for(var i=0;i<NDAYS;i++)a.push(emptyDay());return a;})();
    HIGHLIGHTS=_defaultHighlights();
    try{ if(typeof renderLegend==='function') renderLegend(); }catch(e){}
    try{ if(typeof renderMain==='function') renderMain(); }catch(e){}
    try{ if(typeof renderSpkGrid==='function') renderSpkGrid(); }catch(e){}
    try{ if(typeof renderBento==='function') renderBento(); }catch(e){}
  }

  // ── Backend (Supabase) ──────────────────────────────────
  // Apaga no servidor e, ao concluir, zera o estado local e re-renderiza
  // SEM recarregar a página — assim o editor continua logado (WP_ENABLED)
  // e o botão de adicionar participante permanece visível.
  if(window.SB && SB.enabled){
    SB.wipe().then(function(){
      try{ SB.log('Apagou TODOS os dados',''); }catch(e){}
      _resetLocalAndRender();
      alert('Dados apagados.');
    }).catch(function(err){
      var msg = (err && err.message) ? err.message : String(err||'');
      if(/master/i.test(msg)){
        alert('Apenas o usuário master pode apagar todos os dados.');
      } else {
        alert('Não foi possível apagar os dados: ' + msg);
      }
    });
    return;
  }

  // ── Modo local (sem backend) ────────────────────────────
  try{ localStorage.removeItem(LS_KEY); localStorage.removeItem(DATA_KEY); }catch(e){}
  SLOTS=buildSlots();
  _resetLocalAndRender();
  saveData();
  logAction('Apagou TODOS os dados');
  alert('Dados apagados.');
}

// ── Compressão de imagem → WebP < alvo (KB) no próprio navegador ──
function compressToWebp(srcDataUrl, maxDim, targetKB, cb){
  maxDim=maxDim||800; targetKB=targetKB||100;
  var img=new Image();
  img.onload=function(){
    var w=img.width,h=img.height;
    if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
    if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
    var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    var q=0.92, out=cv.toDataURL('image/webp',q);
    var type = out.indexOf('image/webp')>-1 ? 'image/webp' : 'image/jpeg';
    if(type==='image/jpeg') out=cv.toDataURL(type,q);
    var kb=function(d){ return (d.length*3/4)/1024; };
    var tries=0;
    while(kb(out)>targetKB && q>0.38 && tries<9){ q-=0.08; out=cv.toDataURL(type,q); tries++; }
    if(kb(out)>targetKB && maxDim>180){ return compressToWebp(srcDataUrl, Math.round(maxDim*0.8), targetKB, cb); }
    cb(out);
  };
  img.src=srcDataUrl;
}
