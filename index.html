function renderMain(){
  var sc=SCHEDULES[curDay];
  var vis=ROOMS.filter(function(r){return !hiddenR[r.id];});
  if(curView==='grid') renderGrid(sc,vis);
  else if(curView==='cards') renderCards(sc);
  else if(curView==='gantt') renderGantt(sc,vis);
  else renderList(sc,vis);
  updateStats(sc);
}

function renderGrid(sc,vis){
  document.getElementById('agendaContent').className='wrap';
  document.getElementById('roomFilters').style.display='none';
  var sHdr=document.getElementById('stickyRoomHdr'); sHdr.innerHTML=''; sHdr.style.display='none';
  var gz=_gridZoom;

  function toMinG(t){ var p=(t||'00:00').split(':'); return parseInt(p[0])*60+parseInt(p[1]); }
  var activeSlots=SLOTS.filter(function(s){return !s.isBreak;});
  if(!activeSlots.length){ document.getElementById('agendaContent').innerHTML=''; return; }

  var visRooms=ROOMS.filter(function(r){return !hiddenR[r.id];});

  // ── Configurações de dimensão ──────────────────────────
  var PPM = 3;           // pixels por minuto  (30min = 90px, 1h = 180px)
  var TIME_W = 56;       // largura da coluna de horários em px
  var ROOM_W = 160;      // largura mínima de cada sala em px

  var dayStart = toMinG(activeSlots[0].label);
  var dayEnd   = toMinG(activeSlots[activeSlots.length-1].label) + 30;
  // Extender dayEnd se alguma palestra termina além
  for(var si0=0;si0<activeSlots.length;si0++){
    var sl0=activeSlots[si0].label;
    for(var ri0=0;ri0<ROOMS.length;ri0++){
      var tk0=sc[sl0]&&sc[sl0][ROOMS[ri0].id];
      if(tk0){ var te0=toMinG(sl0)+talkDur(tk0); if(te0>dayEnd) dayEnd=te0; }
    }
  }
  var totalH = (dayEnd-dayStart)*PPM;

  // Slots a mostrar na coluna de horários: apenas múltiplos de 30min
  // (slots intermediários criados automaticamente não aparecem como label,
  //  mas suas linhas de fundo ainda são desenhadas)
  var labelSlots = activeSlots.filter(function(s){
    var m=toMinG(s.label); return m%30===0;
  });

  // ── Construção do HTML ────────────────────────────────
  var h='<div id="gridZoomWrap" style="zoom:'+gz+';transform-origin:top left;width:100%;">';

  // ── Header: célula de canto + célula por sala ──
  h+='<div style="display:flex;position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:2px solid var(--border);box-shadow:0 2px 6px rgba(0,0,0,.08);">';
  h+='<div style="width:'+TIME_W+'px;min-width:'+TIME_W+'px;flex-shrink:0;"></div>';
  for(var i=0;i<ROOMS.length;i++){
    var r=ROOMS[i];
    if(hiddenR[r.id]){
      // Sala oculta — coluna estreita com nome vertical e botão para reabrir
      h+='<div class="rh-cell" style="width:28px;min-width:28px;flex-shrink:0;padding:3px 2px;overflow:hidden;cursor:pointer;" onclick="toggleRoomFilter(\''+r.id+'\')" title="Mostrar '+esc(r.name)+'">'+
        '<div style="writing-mode:vertical-rl;white-space:nowrap;font-size:9px;color:var(--text2);opacity:.5;overflow:hidden;text-overflow:ellipsis;max-height:80px;">'+esc(r.name)+'</div></div>';
    } else {
      h+='<div class="rh-cell" style="flex:1;min-width:'+ROOM_W+'px;text-align:center;">'+
        '<div class="rbadge" style="background:var(--bg);color:var(--text2)" onclick="toggleRoomFilter(\''+r.id+'\')" title="Ocultar '+esc(r.name)+'">'+esc(r.name)+'</div></div>';
    }
  }
  h+='</div>';

  // ── Corpo: coluna de tempo + colunas de sala ──
  h+='<div style="display:flex;position:relative;min-width:fit-content;">';

  // Coluna de horários (sticky left) — só mostra horários redondos (múltiplos de 30min)
  h+='<div style="width:'+TIME_W+'px;min-width:'+TIME_W+'px;flex-shrink:0;position:sticky;left:0;z-index:20;background:var(--bg);height:'+totalH+'px;border-right:1px solid var(--border);">';
  for(var si2=0;si2<labelSlots.length;si2++){
    var topT=(toMinG(labelSlots[si2].label)-dayStart)*PPM;
    h+='<div style="position:absolute;top:'+topT+'px;left:0;right:0;padding:3px 6px 0;font-size:11px;font-weight:500;color:var(--text2);font-family:var(--mono);white-space:nowrap;">'+labelSlots[si2].label+'</div>';
  }
  h+='</div>';

  // Colunas das salas
  for(var ri2=0;ri2<ROOMS.length;ri2++){
    var room=ROOMS[ri2];

    if(hiddenR[room.id]){
      // Sala oculta — coluna estreita, clicável para reabrir
      h+='<div style="width:28px;min-width:28px;flex-shrink:0;height:'+totalH+'px;border-left:1px solid var(--border);background:var(--bg);cursor:pointer;opacity:.4;" onclick="toggleRoomFilter(\''+room.id+'\')"></div>';
      continue;
    }

    h+='<div style="flex:1;min-width:'+ROOM_W+'px;position:relative;height:'+totalH+'px;border-left:1px solid var(--border);background:var(--bg);">';

    // Linhas horizontais — apenas nos slots redondos (a cada 30min)
    for(var si3=0;si3<labelSlots.length;si3++){
      var lTop=(toMinG(labelSlots[si3].label)-dayStart)*PPM;
      var isHour=(toMinG(labelSlots[si3].label)%60===0);
      h+='<div style="position:absolute;top:'+lTop+'px;left:0;right:0;border-top:1px solid '+(isHour?'var(--border)':'rgba(0,0,0,0.06)')+';pointer-events:none;"></div>';
    }

    // Drop targets por slot (para drag-drop)
    for(var si4=0;si4<activeSlots.length;si4++){
      var slMin4=toMinG(activeSlots[si4].label);
      var nextMin4=(si4+1<activeSlots.length)?toMinG(activeSlots[si4+1].label):dayEnd;
      var dTop=(slMin4-dayStart)*PPM;
      var dH=(nextMin4-slMin4)*PPM;
      var cid='cell-'+activeSlots[si4].label.replace(':','-')+'-'+room.id;
      var ddAttrs=WP_ENABLED
        ?' ondragover="onDragOver(event,\''+activeSlots[si4].label+'\',\''+room.id+'\')" ondragleave="onDragLeave(event)" ondrop="onDrop(event,\''+activeSlots[si4].label+'\',\''+room.id+'\')"'
        :'';
      h+='<div class="tcell" id="'+cid+'" data-slot="'+activeSlots[si4].label+'" data-room="'+room.id+'"'+ddAttrs+' style="position:absolute;top:'+dTop+'px;left:0;right:0;height:'+dH+'px;min-height:0;padding:0;border:none;background:transparent;z-index:1;"></div>';
    }

    // Cards das palestras
    for(var si5=0;si5<activeSlots.length;si5++){
      var slLabel=activeSlots[si5].label;
      var t=sc[slLabel]&&sc[slLabel][room.id];
      if(!t||!matchQ(t)) continue;

      var tStartMin=toMinG(slLabel);
      var tDur=talkDur(t);
      var cardTop=(tStartMin-dayStart)*PPM+4;
      var cardH=tDur*PPM-8;
      if(cardH<20) cardH=20;

      // Montar conteúdo do card
      var spkIds2=t.speakerIds&&t.speakerIds.length?t.speakerIds:(t.speakerId?[t.speakerId]:[]);
      var avHtml='';
      for(var ai2=0;ai2<Math.min(spkIds2.length,2);ai2++){
        var sp2=findSpk(spkIds2[ai2]);
        avHtml+=sp2&&sp2.photo
          ?'<img class="cthumb" src="'+sp2.photo+'" alt="">'
          :'<div class="cinit" style="background:'+avColor(sp2?sp2.name:(t.speakerName||''))+'">'+initials(sp2?sp2.name:(t.speakerName||''))+'</div>';
      }
      if(spkIds2.length>2) avHtml+='<div class="cav-more">+'+(spkIds2.length-2)+'</div>';
      var av='<div class="cav-stack">'+avHtml+'</div>';

      var fmtBadge='';
      if(t.format){for(var fi=0;fi<FORMATS.length;fi++) if(FORMATS[fi].val===t.format){fmtBadge='<span class="fmt-badge '+FORMATS[fi].cls+'">'+esc(FORMATS[fi].label)+'</span>';break;}}
      var accBadge='';
      if(t.libras)   accBadge+='<span class="acc-tag acc-tag-libras">🤟 Libras</span>';
      if(t.traducao) accBadge+='<span class="acc-tag acc-tag-trad">🌐 Tradução</span>';

      var metaHtml='<div class="card-meta"><span class="card-meta-left">'+
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><polyline points="8,5 8,8 10,10"/></svg>'+
        slLabel+' – '+addM(slLabel,tDur)+'</span>'+(fmtBadge?fmtBadge:'')+'</div>';
      var spkHtml=(t.speakerName||spkIds2.length)?'<div class="cspk">'+esc(t.speakerName||'')+'</div>':'';
      var dragAttrs=WP_ENABLED?' draggable="true" ondragstart="onDragStart(event,\''+esc(t.id)+'\')" ondragend="onDragEnd(event)"':'';
      var ts=talkStyle(t,room);
      h+='<div class="card '+ts.cls+'" id="talk-'+t.id+'" data-talkid="'+esc(t.id)+'"'+dragAttrs+
         ' onclick="openTalkDetail(\''+esc(t.id)+'\')"'+
         ' style="position:absolute;top:'+cardTop+'px;left:4px;right:4px;height:'+cardH+'px;min-height:20px;overflow:hidden;z-index:5;background:'+ts.bg+';border-left-color:'+ts.color+';color:var(--text);--card-accent:color-mix(in srgb,'+ts.color+' 48%,var(--border));--card-tint:color-mix(in srgb,'+ts.color+' 9%,var(--surface));">'+
         metaHtml+
         '<div class="card-top">'+av+'<span class="ctitle">'+esc(L(t.title))+'</span></div>'+
         spkHtml+
         (accBadge?'<div class="card-acc">'+accBadge+'</div>':'')+
         '</div>';
    }

    h+='</div>'; // /coluna sala
  }

  h+='</div>'; // /corpo
  h+='</div>'; // /gridZoomWrap

  document.getElementById('agendaContent').innerHTML=h;
  setTimeout(function(){
    _gridInitPinch();
    _updateZoomControls();
  },0);
}

function _gridInitPinch(){
  var wrap = document.getElementById('agendaContent');
  if(!wrap||wrap._pinchInit) return;
  wrap._pinchInit = true;
  var _pBase=null, _pZ=1;
  wrap.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      e.preventDefault();
      _pBase=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
      _pZ=_gridZoom;
    }
  },{passive:false});
  wrap.addEventListener('touchmove',function(e){
    if(e.touches.length===2&&_pBase){
      e.preventDefault();
      var dist=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
      gridSetZoom(_pZ*(dist/_pBase));
    }
  },{passive:false});
  wrap.addEventListener('touchend',function(){_pBase=null;});
}

function renderCards(sc){
  document.getElementById('agendaContent').className='wrap list-mode';
  document.getElementById('stickyRoomHdr').style.display='none';
  document.getElementById('roomFilters').style.display='flex';
  var visRooms=ROOMS.filter(function(r){return !hiddenR[r.id];});
  var h='<div class="cgrid-wrap">';
  for(var si=0;si<SLOTS.length;si++){
    var slot=SLOTS[si]; if(slot.isBreak) continue;
    var hasAny=false;
    for(var ri=0;ri<visRooms.length;ri++){ if(sc[slot.label]&&sc[slot.label][visRooms[ri].id]&&matchQ(sc[slot.label][visRooms[ri].id])) hasAny=true; }
    if(!hasAny) continue;
    h+='<div class="cgrid-slot-group"><div class="cgrid-slot-time">'+slot.label+'</div><div class="cgrid-slot-cards">';
    for(var ri=0;ri<visRooms.length;ri++){
      var room=visRooms[ri], t=sc[slot.label]&&sc[slot.label][room.id];
      if(!t||!matchQ(t)) continue;
      var ts=talkStyle(t,room);
      var spkIds=t.speakerIds&&t.speakerIds.length?t.speakerIds:(t.speakerId?[t.speakerId]:[]);
      var spkAvatars='';
      var cgMax=2;
      for(var ai=0;ai<Math.min(spkIds.length,cgMax);ai++){
        var sp=findSpk(spkIds[ai]);
        spkAvatars+=sp&&sp.photo?'<img class="cgrid-av" src="'+sp.photo+'" alt="">':'<div class="cgrid-avini" style="background:'+avColor(sp?sp.name:(t.speakerName||''))+'">'+initials(sp?sp.name:(t.speakerName||''))+'</div>';
      }
      if(spkIds.length>cgMax){
        spkAvatars+='<div class="cgrid-avini" style="background:rgba(0,0,0,.3);font-size:9px;">+' + (spkIds.length-cgMax) + '</div>';
      }
      h+='<div class="cgrid-card '+ts.cls+'" style="background:'+ts.bg+';border-left-color:'+ts.color+';color:var(--text);--card-accent:color-mix(in srgb,'+ts.color+' 48%,var(--border));--card-tint:color-mix(in srgb,'+ts.color+' 9%,var(--surface));" onclick="openTalkDetail(\''+esc(t.id)+'\')">'+
        '<div class="cgrid-room-tag" style="color:'+ts.color+'">'+esc(room.name)+'</div>'+
        '<div class="cgrid-title">'+esc(L(t.title))+'</div>'+
        (t.speakerName?'<div class="cgrid-spk"><div style="display:flex;margin-right:4px">'+spkAvatars+'</div><span>'+esc(t.speakerName)+'</span></div>':'')+
        (function(){ var b=''; if(t.format){for(var fi=0;fi<FORMATS.length;fi++) if(FORMATS[fi].val===t.format){b+='<span class="fmt-badge '+FORMATS[fi].cls+'" style="margin-top:5px;display:inline-block">'+esc(FORMATS[fi].label)+'</span> ';break;}} if(t.libras) b+='<span style="font-size:11px" title="Libras">🤟</span>'; if(t.traducao) b+='<span style="font-size:11px" title="Tradução">🌐</span>'; return b?'<div style="margin-top:4px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">'+b+'</div>':''; })()+
        '</div>';
    }
    h+='</div></div>';
  }
  if(h==='<div class="cgrid-wrap">') h+='<div class="nores">'+t18('noResults')+'</div>';
  h+='</div>';
  document.getElementById('agendaContent').innerHTML=h;
}

function renderList(sc,vis){
  document.getElementById('agendaContent').className='wrap list-mode';
  document.getElementById('stickyRoomHdr').style.display='none';
  document.getElementById('roomFilters').style.display='flex';

         '</div></div>';

// GANTT VIEW
// ════════════════════════════════════════
var _ganttZoom = 1; // 1 = 100%, 2 = 200%, etc.
var _ganttZoomMin = 1;
var _ganttZoomMax = 10;
var _ganttZoomStep = 0.5;

function ganttSetZoom(z){
  z = Math.round(z * 10) / 10;
  z = Math.max(_ganttZoomMin, Math.min(_ganttZoomMax, z));
  _ganttZoom = z;

  var outer = document.getElementById('ganttOuter');
  var wrap  = document.getElementById('ganttWrap');
  if(!outer||!wrap){ _updateZoomControls(); return; }

  var scrollRatio = outer.scrollLeft / (outer.scrollWidth - outer.clientWidth || 1);
  wrap.style.setProperty('--gz', z);

  requestAnimationFrame(function(){
    var maxScroll = outer.scrollWidth - outer.clientWidth;
    outer.scrollLeft = scrollRatio * maxScroll;
    _updateZoomControls();
  });
}

  function toMin(t){ var p=t.split(':'); return parseInt(p[0])*60+parseInt(p[1]); }
  var dayStart=toMin(firstSlot), dayEnd=toMin(lastSlot)+30, totalMin=dayEnd-dayStart;

        'onclick="openTalkDetail(\''+esc(t.id)+'\')" title="'+esc(L(t.title))+'">'+

          '<div class="gantt-ruler-inner">'+ticksHtml+'</div>'+

  _ganttInitPinch();

function _ganttInitPinch(){
  var outer = document.getElementById('ganttOuter');
  if(!outer) return;
  var _pBase=null, _pZ=1;
  outer.addEventListener('touchstart', function(e){
    if(e.touches.length===2){
      e.preventDefault();
      _pBase = Math.hypot(e.touches[1].clientX-e.touches[0].clientX, e.touches[1].clientY-e.touches[0].clientY);
      _pZ = _ganttZoom;
    }
  },{passive:false});
  outer.addEventListener('touchmove', function(e){
    if(e.touches.length===2 && _pBase){
      e.preventDefault();
      var dist = Math.hypot(e.touches[1].clientX-e.touches[0].clientX, e.touches[1].clientY-e.touches[0].clientY);
      var newZ = _pZ * (dist/_pBase);
      ganttSetZoom(newZ);
    }
  },{passive:false});
  outer.addEventListener('touchend', function(){ _pBase=null; });
}

function buildSearchDrop(q, dropId){
  var drop = document.getElementById(dropId);
  if(!drop) return;
  if(!q){ drop.classList.remove('on'); drop.innerHTML=''; return; }

  var results = [];
  for(var d=0;d<NDAYS;d++){
    var sc = SCHEDULES[d], slotKeys = Object.keys(sc);
    for(var si=0;si<slotKeys.length;si++){
      var slotObj = sc[slotKeys[si]], roomKeys = Object.keys(slotObj);
      for(var ri=0;ri<roomKeys.length;ri++){
        var t = slotObj[roomKeys[ri]];
        if(!t||!t.id) continue;
        if((t.title||'').toLowerCase().indexOf(q)<0 && (t.speakerName||'').toLowerCase().indexOf(q)<0) continue;
        var room = null;
        for(var rr=0;rr<ROOMS.length;rr++) if(ROOMS[rr].id===roomKeys[ri]){ room=ROOMS[rr]; break; }
        results.push({talk:t, room:room||{}, day:d, slot:slotKeys[si]});
        if(results.length>=8) break;
      }
      if(results.length>=8) break;
    }
    if(results.length>=8) break;
  }

  drop.innerHTML = '';
  if(!results.length){
    var empty = document.createElement('div');
    empty.className = 'srch-empty';
    empty.textContent = 'Nenhum resultado para "' + q + '"';
    drop.appendChild(empty);
    drop.classList.add('on');
    return;
  }

  for(var i=0;i<results.length;i++){
    var r = results[i];
    var item = document.createElement('div');
    item.className = 'srch-item';
    item.dataset.talkId  = r.talk.id;
    item.dataset.talkDay  = String(r.day);
    item.dataset.talkSlot = r.slot;
    item.addEventListener('mousedown', function(e){
      e.preventDefault();
      jumpToTalk(this.dataset.talkId, parseInt(this.dataset.talkDay), this.dataset.talkSlot);
    });

    var dot = document.createElement('div');
    dot.className = 'srch-dot';
    var _ts=talkStyle(r.talk,r.room);
    dot.style.background = _ts.color || '#999';

    var info = document.createElement('div');
    info.className = 'srch-info';

    var titleEl = document.createElement('div');
    titleEl.className = 'srch-title';
    titleEl.textContent = L(r.talk.title) || '';

    var metaEl = document.createElement('div');
    metaEl.className = 'srch-meta';
    metaEl.textContent = (r.day===0?'Dia 1':'Dia 2') + ' · ' + r.slot + (r.talk.speakerName ? ' · 🎤 ' + r.talk.speakerName : '');

    info.appendChild(titleEl);
    info.appendChild(metaEl);

    var badge = document.createElement('div');
    badge.className = 'srch-badge';
    badge.style.background = _ts.bg || '#eee';
    badge.style.color = _ts.color || '#333';
    badge.textContent = r.room.name || '';

    item.appendChild(dot);
    item.appendChild(info);
    item.appendChild(badge);
    drop.appendChild(item);
  }
  drop.classList.add('on');
}

function addToGoogleCalendar(id){
  var found=findTalk(id); if(!found) return;
  var t=found.talk, room=found.room, day=t.day!==undefined?t.day:curDay, date=GCAL_DATES[day];
  function gct(lbl,dt){ var p=lbl.split(':'); return dt+'T'+p2(parseInt(p[0]))+p2(parseInt(p[1]))+'00'; }
  var start=gct(t.time,date), end=gct(addM(t.time,talkDur(t)),date);
  var locStr = (t.locText||'')||(room.name+' — Impacta Mais 2026');
  var desc=(t.speakerName?'Palestrante: '+t.speakerName:'')+(t.desc?(t.speakerName?'\n\n':'')+t.desc:'')+'\n\nLocal: Impacta Mais 2026';
  var params='action=TEMPLATE'
    +'&text='+encodeURIComponent(t.title)
    +'&dates='+start+'/'+end
    +'&details='+encodeURIComponent(desc)
    +'&location='+encodeURIComponent(locStr)
    +'&sf=true&output=xml';
  var webUrl='https://calendar.google.com/calendar/render?'+params;

  // Detecta mobile
  var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(!isMobile){ window.open(webUrl,'_blank'); return; }

  // iOS — tenta abrir o app via URL scheme; fallback para web após 1.5s
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
    var iosUrl='googlecalendar://calendar.google.com/calendar/render?'+params;
    var fallbackTimer=setTimeout(function(){ window.open(webUrl,'_blank'); },1500);
    var iframe=document.createElement('iframe');
    iframe.style.display='none';
    iframe.src=iosUrl;
    document.body.appendChild(iframe);
    setTimeout(function(){ document.body.removeChild(iframe); },3000);
    // Se a página perder foco, o app abriu — cancela o fallback
    window.addEventListener('blur',function onBlur(){
      clearTimeout(fallbackTimer);
      window.removeEventListener('blur',onBlur);
    },{once:true});
    return;
  }

  // Android — intent:// com fallback para web
  var intentUrl='intent://calendar.google.com/calendar/render?'+params
    +'#Intent;scheme=https;package=com.google.android.calendar;S.browser_fallback_url='
    +encodeURIComponent(webUrl)+';end';
  window.location.href=intentUrl;
}

function saveTalk(){
  if(!WP_ENABLED && !confirm('Token WordPress não configurado. A palestra será salva apenas localmente e poderá ser perdida ao recarregar a página. Continuar?')) return;
  var titleObj=_mlRead('evTitle'); var title=titleObj.pt||titleObj.en||titleObj.es;
  if(!title){ alert('Preencha o título (ao menos um idioma).'); return; }

  var day    = parseInt(document.getElementById('evDay').value,10);
  var time   = document.getElementById('evTime').value;
  var room   = document.getElementById('evRoom').value;
  var descObj=_mlRead('evDesc');
  var hub    = document.getElementById('evHub').value;
  var format = document.getElementById('evFormat').value;
  var libras  = document.getElementById('evLibras').checked;
  var traducao= document.getElementById('evTrad').checked;
  var duration = Math.max(15, parseInt(document.getElementById('evDuration').value||'30', 10)||30);

  // Valida dia
  if(isNaN(day) || day < 0 || day >= NDAYS){ alert('Dia inválido.'); return; }
  // Garante que o slot de início existe
  var slotExists = false;
  for(var si=0;si<SLOTS.length;si++) if(SLOTS[si].label===time){ slotExists=true; break; }
  if(!slotExists){ SLOTS.push({label:time, isBreak:false}); sortSlots(); }

  // Slot de fim: só insere se for múltiplo de 30min (ex: 10:00, 10:30, 11:00...)
  // Slots quebrados (ex: 10:02) não precisam existir — o card usa posição absoluta
  var endTime = addM(time, duration);
  var endMin = (function(){ var p=endTime.split(':'); return parseInt(p[0])*60+parseInt(p[1]); })();
  if(endMin % 30 === 0){
    var endSlotExists = false;
    for(var si=0;si<SLOTS.length;si++) if(SLOTS[si].label===endTime){ endSlotExists=true; break; }
    if(!endSlotExists){ SLOTS.push({label:endTime, isBreak:false}); sortSlots(); }
  }

  for(var _d=0;_d<NDAYS;_d++){ if(!SCHEDULES[_d][time]) SCHEDULES[_d][time]={}; }

  // Verifica conflito: outra palestra já nesse slot+sala (exceto ela mesma se for edição)
  var existing = SCHEDULES[day][time][room];
  if(existing && existing.id !== editTalkId){
    if(!confirm('Já existe uma palestra neste horário e sala. Substituir?')) return;
  }

  // Monta nomes dos palestrantes
  var spkNames = [];
  for(var i=0;i<pickedSpks.length;i++){
    var s=findSpk(pickedSpks[i]); if(s) spkNames.push(s.name);
  }

  var locText = (document.getElementById('evLocText') ? document.getElementById('evLocText').value.trim() : '');
  var locImg  = _locImgData || (document.getElementById('locImgPrev') && document.getElementById('locImgPrev').src && document.getElementById('locImgPrev').style.display!=='none' ? document.getElementById('locImgPrev').src : '');
  _locImgData = null; // reset

  // Monta objeto da palestra — preserva id existente em edição
  var talkId = editTalkId || makeId('t');
  var obj = {
    id: talkId, title: titleObj, room: room, time: time, day: day,
    duration: duration,
    desc: descObj, hub: hub, format: format, libras: libras, traducao: traducao,
    speakerIds: pickedSpks.slice(),
    speakerId:  pickedSpks[0]||null,
    speakerName: spkNames.join(', '),
    locText: locText, locImg: locImg
  };

  // Se for edição, remove a palestra do local ANTERIOR primeiro
  // (pode ter mudado de dia/slot/sala)
  if(editTalkId){
    for(var d=0;d<NDAYS;d++){
      var slots = Object.keys(SCHEDULES[d]);
      for(var si=0;si<slots.length;si++){
        var slotObj = SCHEDULES[d][slots[si]];
        var rooms   = Object.keys(slotObj);
        for(var ri=0;ri<rooms.length;ri++){
          if(slotObj[rooms[ri]] && slotObj[rooms[ri]].id === editTalkId){
            delete slotObj[rooms[ri]];
          }
        }
      }
    }
  }

  // Garante que o slot destino existe
  if(!SCHEDULES[day][time]) SCHEDULES[day][time] = {};

  // Insere palestra no novo local
  SCHEDULES[day][time][room] = obj;

  // Muda para o dia da palestra e salva
  _setActiveDay(day);

  // Tira snapshot ANTES do closeModal
  var snapshot = JSON.parse(JSON.stringify({speakers:SPEAKERS,schedules:SCHEDULES,slots:SLOTS}));

  closeModal();
  renderMain();

  if(window.SB && SB.enabled){ SB.upsertTalk(obj); } else { saveData(); }
  logAction(editTalkId?'Editou a palestra':'Criou a palestra', title);
}

// CROP STATE
// ────────────────────────────────────────
var cropState = null;

// Passo 1: usuário escolhe arquivo → pré-reduz se necessário → abre modal
function handlePhoto(inp){
  var f=inp.files[0]; if(!f) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var original=new Image();
    original.onload=function(){
      var MAX=1200; // reduz para no máximo 1200px no lado maior antes do crop
      var ow=original.naturalWidth, oh=original.naturalHeight;
      var scale=(ow>MAX||oh>MAX) ? MAX/Math.max(ow,oh) : 1;
      var cw=Math.round(ow*scale), ch=Math.round(oh*scale);
      var c=document.createElement('canvas'); c.width=cw; c.height=ch;
      c.getContext('2d').drawImage(original,0,0,cw,ch);
      // Guarda como WebP já pré-reduzida
      var reduced=c.toDataURL('image/webp',0.9);
      if(reduced.indexOf('data:image/webp')<0) reduced=c.toDataURL('image/jpeg',0.9);
      openCropModal(reduced, cw, ch);
    };
    original.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

// Passo 2: abre modal de crop com a imagem já pré-reduzida
function openCropModal(src, natW, natH){
  var SIZE=240; // diâmetro do círculo no preview (px)

  cropState=null; // reset

  var body=
    '<div style="text-align:center;margin-bottom:8px;font-size:13px;color:var(--text2);">'+
    'Arraste para reposicionar · use o zoom para ajustar</div>'+
    '<div id="cropWrap" style="width:100%;height:280px;position:relative;overflow:hidden;background:#1a1a1a;border-radius:8px;cursor:move;"'+
      ' onmousedown="cropDragStart(event)" onmousemove="cropDragMove(event)" onmouseup="cropDragEnd()" onmouseleave="cropDragEnd()"'+
      ' ontouchstart="cropTouchStart(event)" ontouchmove="cropTouchMove(event)" ontouchend="cropDragEnd()">'+
      '<canvas id="cropCanvas" style="position:absolute;top:0;left:0;"></canvas>'+
      '<div style="position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;">'+
        '<div style="width:'+SIZE+'px;height:'+SIZE+'px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.6);"></div>'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;align-items:center;gap:8px;margin-top:10px;">'+
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>'+
      '<input type="range" id="cropZoom" min="100" max="400" value="100" oninput="cropZoomChange(this.value)" style="flex:1;accent-color:var(--blue);">'+
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg>'+
    '</div>';

  openModal('✂️ Ajustar Foto', body,
    '<button class="btn" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-p" onclick="cropConfirm()">✔ Usar esta posição</button>', false);

  // Carrega imagem e inicializa depois do layout estar pronto
  var img=new Image();
  img.onload=function(){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        var wrap=document.getElementById('cropWrap'); if(!wrap) return;
        var WW=wrap.offsetWidth, WH=wrap.offsetHeight;

        // Escala inicial: imagem preenchendo o círculo pelo lado menor
        var scaleToFill = SIZE / Math.min(natW, natH);

        cropState={
          img:img,
          natW:natW, natH:natH,
          SIZE:SIZE,
          WW:WW, WH:WH,
          // posição do canto sup-esq da imagem renderizada (em px do wrap)
          // inicia centralizada
          x: WW/2 - natW*scaleToFill/2,
          y: WH/2 - natH*scaleToFill/2,
          scale: scaleToFill,        // px por pixel da imagem
          baseScale: scaleToFill,    // escala mínima (100% do slider)
          dragging:false, lastX:0, lastY:0
        };

        _cropDraw();
      });
    });
  };
  img.src=src;
}

// Desenha a imagem no canvas interno
function _cropDraw(){
  var s=cropState; if(!s) return;
  var wrap=document.getElementById('cropWrap');
  var canvas=document.getElementById('cropCanvas'); if(!canvas) return;
  canvas.width=s.WW; canvas.height=s.WH;
  var ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,s.WW,s.WH);
  ctx.drawImage(s.img, s.x, s.y, s.natW*s.scale, s.natH*s.scale);
}

function cropZoomChange(v){
  if(!cropState) return;
  var newScale = cropState.baseScale * (parseFloat(v)/100);
  // Zoom a partir do centro do wrap
  var cx=cropState.WW/2, cy=cropState.WH/2;
  var ratio=newScale/cropState.scale;
  cropState.x = cx - (cx-cropState.x)*ratio;
  cropState.y = cy - (cy-cropState.y)*ratio;
  cropState.scale=newScale;
  _cropDraw();
}

function cropDragStart(e){
  if(!cropState) return; e.preventDefault();
  cropState.dragging=true;
  cropState.lastX=e.touches?e.touches[0].clientX:e.clientX;
  cropState.lastY=e.touches?e.touches[0].clientY:e.clientY;
}
function cropDragMove(e){
  if(!cropState||!cropState.dragging) return; e.preventDefault();
  var cx=e.touches?e.touches[0].clientX:e.clientX;
  var cy=e.touches?e.touches[0].clientY:e.clientY;
  cropState.x+=cx-cropState.lastX; cropState.y+=cy-cropState.lastY;
  cropState.lastX=cx; cropState.lastY=cy;
  _cropDraw();
}
function cropDragEnd(){ if(cropState) cropState.dragging=false; }
function cropTouchStart(e){ cropDragStart(e); }
function cropTouchMove(e){ cropDragMove(e); }

// Passo 3: exporta a região do círculo como WebP 400×400, comprimido
function cropConfirm(){
  if(!cropState) return;
  var s=cropState;

  // Centro e raio do círculo no wrap
  var cx=s.WW/2, cy=s.WH/2, r=s.SIZE/2;

  // Coordenadas do círculo em pixels da imagem ORIGINAL
  var srcX=(cx-r-s.x)/s.scale;
  var srcY=(cy-r-s.y)/s.scale;
  var srcS=s.SIZE/s.scale; // tamanho do quadrado a capturar (em px da imagem)

  var OUT=400;
  var canvas=document.createElement('canvas');
  canvas.width=OUT; canvas.height=OUT;
  var ctx=canvas.getContext('2d');
  // Clip circular
  ctx.beginPath(); ctx.arc(OUT/2,OUT/2,OUT/2,0,Math.PI*2); ctx.clip();
  // Desenha a região selecionada escalada para 400×400
  ctx.drawImage(s.img, srcX, srcY, srcS, srcS, 0, 0, OUT, OUT);

  // Exporta como WebP, comprime iterativamente se >500KB
  function compress(quality){
    var url=canvas.toDataURL('image/webp', quality);
    if(url.indexOf('data:image/webp')<0) url=canvas.toDataURL('image/jpeg', quality);
    var kb=Math.round(url.length*0.75/1024);
    if(kb>500 && quality>0.3){
      setTimeout(function(){ compress(quality-0.1); }, 0);
    } else {
      photoData=url;
      closeModal();
      setTimeout(function(){ openSpkFormWithPhoto(editSpkId, photoData); }, 100);
    }
  }
  compress(0.88);
}

// Conta palestras em um objeto schedules (aceita array ou objeto com chaves "0","1")
function _countTalks(schedules){
  var total = 0;
  if(!schedules || typeof schedules !== 'object') return 0;
  var days = Array.isArray(schedules) ? schedules : [schedules['0']||{}, schedules['1']||{}];
  for(var d=0;d<days.length;d++){
    var day = days[d]||{}, slots = Object.keys(day);
    for(var i=0;i<slots.length;i++) total += Object.keys(day[slots[i]]||{}).length;
  }
  return total;
}

// Normaliza schedules para sempre ser um array [day0, day1]
// NÃO usa emptyDay() pois SLOTS pode ainda não estar atualizado
function _normalizeSchedules(schedules){
  var ns=[]; for(var dd=0;dd<NDAYS;dd++) ns.push({});
  if(!schedules || typeof schedules!=='object') return ns;
  for(var d2=0;d2<NDAYS;d2++){
    var src = Array.isArray(schedules) ? (schedules[d2]||{}) : (schedules[String(d2)]||{});
    var ks=Object.keys(src); for(var i=0;i<ks.length;i++) ns[d2][ks[i]]=src[ks[i]];
  }
  return ns;
}

    var slots = Object.keys(day||{});
    for(var i=0;i<slots.length;i++){
      var rooms = Object.keys(day[slots[i]]||{});
      for(var j=0;j<rooms.length;j++){
        var t = day[slots[i]][rooms[j]];
        if(t && t.id) talkCount++;
      }
    }
  };
  countDay(sc0); countDay(sc1);

  var payload = {
    speakers:  snapshot.speakers,
    schedules: [sc0, sc1],
    slots:     snapshot.slots,
    hubs:      snapshot.hubs,
    hubColors: snapshot.hubColors,
    rooms:     snapshot.rooms
  };
  var bodyStr = JSON.stringify(payload);
  console.log('[Agenda] Enviando — palestrantes:'+snapshot.speakers.length+' palestras:'+talkCount+' bytes:'+bodyStr.length);

  return fetch(WP_API_BASE+'/wp-json/agenda/v1/save', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Agenda-Token':WP_TOKEN},
    body: bodyStr
  })
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(res){
    if(res.success){
      console.log('[Agenda] ✅ Salvo — palestrantes:'+(res.speakers||'?')+' palestras:'+(res.talks||'?'));

      // Se o servidor retornou erros de foto, exibe na UI + console
      if(res.photo_errors && res.photo_errors.length > 0){
        console.warn('[Agenda] ⚠️ Fotos com problema:', res.photo_errors);
        var names = res.photo_errors.map(function(e){ return (e.name||e.id)+': '+e.error; }).join('\n');
        showSaveIndicator('error', 'Salvo, mas '+res.photo_errors.length+' foto(s) falharam — veja o console');
        // Alerta visível apenas na primeira ocorrência, para não ser irritante
        if(!_doSaveWP._photoWarned){
          _doSaveWP._photoWarned = true;
          setTimeout(function(){
            alert('⚠️ O servidor não conseguiu salvar a(s) foto(s):\n\n'+names+'\n\nVerifique o log do WordPress (debug.log) para mais detalhes.');
          }, 100);
        }
      } else {
        showSaveIndicator('saved');
      }
    } else {
      throw new Error(res.message||'success=false');
    }
  })
  .catch(function(e){
    console.error('[Agenda] ❌ Falha ao salvar (tentativa '+(attempt+1)+'): '+e.message);
    if(attempt < 3){
      return new Promise(function(resolve){
        setTimeout(function(){ resolve(_doSaveWP(snapshot, attempt+1)); }, 4000);
      });
    }
    showSaveIndicator('error', 'Falha ao salvar — verifique conexão');
  });
}

function doDownloadBackup(filename){
  var payload = {
    _version: 1,
    _exported: new Date().toISOString(),
    speakers: SPEAKERS,
    schedules: SCHEDULES,
    slots: SLOTS,
    hubs: HUBS,
    hubColors: HUB_COLORS,
    rooms: ROOMS
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
}

function doRestoreBackup(input){
  var file = input.files[0]; if(!file) return;
  var st   = document.getElementById('restoreStatus');
  st.style.display='block'; st.style.color='#f9ab00'; st.textContent='⏳ Lendo arquivo…';
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var data = JSON.parse(ev.target.result);
      if(!data.speakers || !data.schedules || !data.slots){
        st.style.color='#d93025'; st.textContent='❌ Arquivo inválido — não é um backup desta agenda.'; return;
      }
      if(!confirm('⚠️ Isso substitui TODOS os dados atuais pelo backup selecionado. Confirmar?')){
        st.style.display='none'; return;
      }
      _applyServerData(data);
      saveData();
      _rerender();
      updateDayTabs();
      st.style.color='#0f9d58'; st.textContent='✅ Backup restaurado! Dados enviados ao servidor.';
      setTimeout(function(){ closeModal(); }, 1800);
    }catch(err){
      st.style.color='#d93025'; st.textContent='❌ Erro ao ler arquivo: '+err.message;
    }
  };
  reader.readAsText(file);
}

function clearAllData(){
  if(!WP_ENABLED) return;

  try{localStorage.removeItem(LS_KEY);}catch(e){}

}

// ── Compressão de imagem → WebP < alvo (KB) no próprio navegador ──
function compressToWebp(srcDataUrl, maxDim, targetKB, cb){
  maxDim=maxDim||800; targetKB=targetKB||100;
  var img=new Image();
  img.onload=function(){
    var w=img.width,h=img.height;
    if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
    if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
    var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h);
    var q=0.92, out=cv.toDataURL('image/webp',q);
    var type = out.indexOf('image/webp')>-1 ? 'image/webp' : 'image/jpeg';
    if(type==='image/jpeg') out=cv.toDataURL(type,q);
    var kb=function(d){ return (d.length*3/4)/1024; };
    var tries=0;
    while(kb(out)>targetKB && q>0.38 && tries<9){ q-=0.08; out=cv.toDataURL(type,q); tries++; }
    if(kb(out)>targetKB && maxDim>180){ return compressToWebp(srcDataUrl, Math.round(maxDim*0.8), targetKB, cb); }
    cb(out);
  };
  img.src=srcDataUrl;
}

// DRAG AND DROP (editor only)
// ════════════════════════════════════════
var _dragId=null;
function onDragStart(e,id){ if(!WP_ENABLED){e.preventDefault();return;} _dragId=id; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',id); setTimeout(function(){e.target.classList.add('dragging');},0); }
function onDragEnd(e){ e.target.classList.remove('dragging'); var cells=document.querySelectorAll('.tcell'); for(var i=0;i<cells.length;i++) cells[i].className='tcell'; }
function onDragOver(e,slot,roomId){ if(!WP_ENABLED) return; e.preventDefault(); if(!_dragId) return; var cell=document.getElementById('cell-'+slot.replace(':','-')+'-'+roomId); if(cell){ var sc=SCHEDULES[curDay],occ=sc[slot]&&sc[slot][roomId]&&sc[slot][roomId].id!==_dragId; cell.className='tcell '+(occ?'drop-forbidden':'drop-over'); } e.dataTransfer.dropEffect='move'; }
function onDragLeave(e){ if(e.currentTarget&&e.currentTarget.classList) e.currentTarget.className='tcell'; }
function _moveTalkTo(id, newSlot, newRoomId){
  if(!WP_ENABLED || !id) return false;
  var talk=null, oldDay=null, oldSlot=null, oldRoomId=null;
  outer:for(var d=0;d<NDAYS;d++){
    var slotKeys=Object.keys(SCHEDULES[d]);
    for(var i=0;i<slotKeys.length;i++){
      var slotObj=SCHEDULES[d][slotKeys[i]], roomKeys=Object.keys(slotObj);
      for(var j=0;j<roomKeys.length;j++){
        if(slotObj[roomKeys[j]] && slotObj[roomKeys[j]].id===id){ talk=slotObj[roomKeys[j]]; oldDay=d; oldSlot=slotKeys[i]; oldRoomId=roomKeys[j]; break outer; }
      }
    }
  }
  if(!talk) return false;
  var dest = SCHEDULES[curDay][newSlot] && SCHEDULES[curDay][newSlot][newRoomId];
  if(dest && dest.id !== id) return false;
  if(oldSlot===newSlot && oldRoomId===newRoomId && oldDay===curDay) return false;
  for(var dd=0;dd<NDAYS;dd++){ if(!SCHEDULES[dd][newSlot]) SCHEDULES[dd][newSlot]={}; }
  delete SCHEDULES[oldDay][oldSlot][oldRoomId];
  talk.time = newSlot; talk.room = newRoomId; talk.day = curDay;
  SCHEDULES[curDay][newSlot][newRoomId] = talk;
  renderMain();
  if(window.SB&&SB.enabled){ SB.upsertTalk(talk); } else { clearTimeout(saveData._t); saveData(); }
  logAction('Moveu a palestra', L(talk.title));
  return true;
}
function onDrop(e,newSlot,newRoomId){
  if(!WP_ENABLED){e.preventDefault();return;}
  e.preventDefault();
  var id = _dragId||e.dataTransfer.getData('text/plain');
  _dragId = null;
  _moveTalkTo(id, newSlot, newRoomId);
}

// ── DRAG por TOQUE (mobile) ──────────────────────────────
var _touchDrag=null;
function _gridTouchStart(e){
  if(!WP_ENABLED || _touchDrag || e.touches.length!==1) return;
  var card = e.target.closest ? e.target.closest('.card[data-talkid]') : null;
  if(!card) return;
  var t=e.touches[0];
  _touchDrag={id:card.getAttribute('data-talkid'), card:card, sx:t.clientX, sy:t.clientY, moved:false, ghost:null, lastCell:null, offX:0, offY:0};
}
function _gridTouchMove(e){
  if(!_touchDrag || e.touches.length!==1) return;
  var t=e.touches[0];
  var dx=t.clientX-_touchDrag.sx, dy=t.clientY-_touchDrag.sy;
  if(!_touchDrag.moved){
    if(Math.abs(dx)+Math.abs(dy) < 12) return;
    _touchDrag.moved=true;
    var c=_touchDrag.card, r=c.getBoundingClientRect();
    var g=c.cloneNode(true);
    g.removeAttribute('id');
    g.style.position='fixed'; g.style.left=r.left+'px'; g.style.top=r.top+'px';
    g.style.width=r.width+'px'; g.style.height=r.height+'px';
    g.style.zIndex='99999'; g.style.opacity='.9'; g.style.pointerEvents='none';
    g.style.boxShadow='0 10px 28px rgba(20,10,40,.35)'; g.style.transform='scale(1.04)'; g.style.margin='0';
    document.body.appendChild(g);
    _touchDrag.ghost=g; _touchDrag.offX=t.clientX-r.left; _touchDrag.offY=t.clientY-r.top;
    c.style.opacity='.25';
  }
  e.preventDefault();
  var g=_touchDrag.ghost;
  if(g){ g.style.left=(t.clientX-_touchDrag.offX)+'px'; g.style.top=(t.clientY-_touchDrag.offY)+'px'; g.style.display='none'; }
  var el=document.elementFromPoint(t.clientX, t.clientY);
  if(g) g.style.display='';
  var cell=el && el.closest ? el.closest('.tcell') : null;
  if(_touchDrag.lastCell && _touchDrag.lastCell!==cell) _touchDrag.lastCell.className='tcell';
  if(cell){
    var sl=cell.getAttribute('data-slot'), rm=cell.getAttribute('data-room');
    var occ = SCHEDULES[curDay][sl] && SCHEDULES[curDay][sl][rm] && SCHEDULES[curDay][sl][rm].id!==_touchDrag.id;
    cell.className='tcell '+(occ?'drop-forbidden':'drop-over');
  }
  _touchDrag.lastCell=cell;
}
function _gridTouchEnd(){
  if(!_touchDrag) return;
  var td=_touchDrag; _touchDrag=null;
  if(td.ghost) td.ghost.remove();
  if(td.card) td.card.style.opacity='';
  var cells=document.querySelectorAll('.tcell'); for(var i=0;i<cells.length;i++) cells[i].className='tcell';
  if(!td.moved) return; // foi um toque → deixa abrir o detalhe
  window._suppressCardClick=true; setTimeout(function(){ window._suppressCardClick=false; },450);
  var cell=td.lastCell;
  if(cell) _moveTalkTo(td.id, cell.getAttribute('data-slot'), cell.getAttribute('data-room'));
}
function _initTouchDrag(){
  if(_initTouchDrag._done) return; _initTouchDrag._done=true;
  document.addEventListener('touchstart', _gridTouchStart, {passive:true});
  document.addEventListener('touchmove', _gridTouchMove, {passive:false});
  document.addEventListener('touchend', _gridTouchEnd, {passive:true});
  document.addEventListener('touchcancel', _gridTouchEnd, {passive:true});
}
_initTouchDrag();

function toggleDark(){

// ── Polling em tempo real — atualiza a cada 30s para todos os usuários ──
var _pollLastHash = '';
function _pollServer(){
  fetch(WP_API_BASE+'/wp-json/agenda/v1/load?_t='+Date.now(),{
    method:'GET', cache:'no-store',
    headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}
  })
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(res){
    if(!res.success||!res.data) return;
    // Usa updated_at como hash — só re-renderiza se houve mudança
    var hash = res.updated_at || JSON.stringify(res.debug||{});
    if(hash === _pollLastHash) return; // sem mudanças
    _pollLastHash = hash;
    // Não sobrescreve se o editor local está no meio de um save
    if(document.getElementById('saveIndicator')&&document.getElementById('saveIndicator').textContent.indexOf('Salvando')>-1) return;
    _applyServerData(res.data);
    _rerender();
    updateDayTabs();
  })
  .catch(function(){}); // silencia erros de rede
}
if(WP_ENABLED && WP_API_BASE) setInterval(_pollServer, 30000); // só quando conectado
