  var map={saving:{text:'💾 Salvando…',color:'#f9ab00'},saved:{text:'✅ Salvo no servidor',color:'#0f9d58'},loading:{text:'⏳ Carregando…',color:'#1a73e8'},loaded:{text:'✅ Dados atualizados',color:'#0f9d58'},error:{text:'⚠️ '+(msg||'Erro'),color:'#d93025'},wp_offline:{text:'⚠️ Servidor offline — recarregue para tentar novamente',color:'#d93025'}};
  var s=map[state]||map.saved; ind.textContent=s.text; ind.style.color=s.color; ind.style.display='flex';
  clearTimeout(ind._t); ind._t=setTimeout(function(){ind.style.display='none';},4000);
}

// ════════════════════════════════════════
// DRAG AND DROP (editor only)
// ════════════════════════════════════════
var _dragId=null;
function onDragStart(e,id){ if(!WP_ENABLED){e.preventDefault();return;} _dragId=id; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',id); setTimeout(function(){e.target.classList.add('dragging');},0); }
function onDragEnd(e){ e.target.classList.remove('dragging'); var cells=document.querySelectorAll('.tcell'); for(var i=0;i<cells.length;i++) cells[i].className='tcell'; }
function onDragOver(e,slot,roomId){ if(!WP_ENABLED) return; e.preventDefault(); if(!_dragId) return; var cell=document.getElementById('cell-'+slot.replace(':','-')+'-'+roomId); if(cell){ var sc=SCHEDULES[curDay],occ=sc[slot]&&sc[slot][roomId]&&sc[slot][roomId].id!==_dragId; cell.className='tcell '+(occ?'drop-forbidden':'drop-over'); } e.dataTransfer.dropEffect='move'; }
function onDragLeave(e){ if(e.currentTarget&&e.currentTarget.classList) e.currentTarget.className='tcell'; }
function _moveTalkTo(id, newSlot, newRoomId){
  if(!WP_ENABLED || !id) return false;
  var talk=null, oldDay=null, oldSlot=null, oldRoomId=null;
  outer:for(var d=0;d<NDAYS;d++){
    var slotKeys=Object.keys(SCHEDULES[d]);
    for(var i=0;i<slotKeys.length;i++){
      var slotObj=SCHEDULES[d][slotKeys[i]], roomKeys=Object.keys(slotObj);
      for(var j=0;j<roomKeys.length;j++){
        if(slotObj[roomKeys[j]] && slotObj[roomKeys[j]].id===id){ talk=slotObj[roomKeys[j]]; oldDay=d; oldSlot=slotKeys[i]; oldRoomId=roomKeys[j]; break outer; }
      }
    }
  }
  if(!talk) return false;
  var dest = SCHEDULES[curDay][newSlot] && SCHEDULES[curDay][newSlot][newRoomId];
  if(dest && dest.id !== id) return false;
  if(oldSlot===newSlot && oldRoomId===newRoomId && oldDay===curDay) return false;
  for(var dd=0;dd<NDAYS;dd++){ if(!SCHEDULES[dd][newSlot]) SCHEDULES[dd][newSlot]={}; }
  delete SCHEDULES[oldDay][oldSlot][oldRoomId];
  talk.time = newSlot; talk.room = newRoomId; talk.day = curDay;
  SCHEDULES[curDay][newSlot][newRoomId] = talk;
  renderMain();
  if(window.SB&&SB.enabled){ SB.upsertTalk(talk); } else { clearTimeout(saveData._t); saveData(); }
  logAction('Moveu a sessão', L(talk.title));
  return true;
}
function onDrop(e,newSlot,newRoomId){
  if(!WP_ENABLED){e.preventDefault();return;}
  e.preventDefault();
  var id = _dragId||e.dataTransfer.getData('text/plain');
  _dragId = null;
  _moveTalkTo(id, newSlot, newRoomId);
}

// ── DRAG por TOQUE (mobile) ──────────────────────────────
var _touchDrag=null;
function _gridTouchStart(e){
  if(!WP_ENABLED || _touchDrag || e.touches.length!==1) return;
  var card = e.target.closest ? e.target.closest('.card[data-talkid]') : null;
  if(!card) return;
  var t=e.touches[0];
  _touchDrag={id:card.getAttribute('data-talkid'), card:card, sx:t.clientX, sy:t.clientY, moved:false, ghost:null, lastCell:null, offX:0, offY:0};
}
function _gridTouchMove(e){
  if(!_touchDrag || e.touches.length!==1) return;
  var t=e.touches[0];
  var dx=t.clientX-_touchDrag.sx, dy=t.clientY-_touchDrag.sy;
  if(!_touchDrag.moved){
    if(Math.abs(dx)+Math.abs(dy) < 12) return;
    _touchDrag.moved=true;
    var c=_touchDrag.card, r=c.getBoundingClientRect();
    var g=c.cloneNode(true);
    g.removeAttribute('id');
    g.style.position='fixed'; g.style.left=r.left+'px'; g.style.top=r.top+'px';
    g.style.width=r.width+'px'; g.style.height=r.height+'px';
    g.style.zIndex='99999'; g.style.opacity='.9'; g.style.pointerEvents='none';
    g.style.boxShadow='0 10px 28px rgba(20,10,40,.35)'; g.style.transform='scale(1.04)'; g.style.margin='0';
    document.body.appendChild(g);
    _touchDrag.ghost=g; _touchDrag.offX=t.clientX-r.left; _touchDrag.offY=t.clientY-r.top;
    c.style.opacity='.25';
  }
  e.preventDefault();
  var g=_touchDrag.ghost;
  if(g){ g.style.left=(t.clientX-_touchDrag.offX)+'px'; g.style.top=(t.clientY-_touchDrag.offY)+'px'; g.style.display='none'; }
  var el=document.elementFromPoint(t.clientX, t.clientY);
  if(g) g.style.display='';
  var cell=el && el.closest ? el.closest('.tcell') : null;
  if(_touchDrag.lastCell && _touchDrag.lastCell!==cell) _touchDrag.lastCell.className='tcell';
  if(cell){
    var sl=cell.getAttribute('data-slot'), rm=cell.getAttribute('data-room');
    var occ = SCHEDULES[curDay][sl] && SCHEDULES[curDay][sl][rm] && SCHEDULES[curDay][sl][rm].id!==_touchDrag.id;
    cell.className='tcell '+(occ?'drop-forbidden':'drop-over');
  }
  _touchDrag.lastCell=cell;
}
function _gridTouchEnd(){
  if(!_touchDrag) return;
  var td=_touchDrag; _touchDrag=null;
  if(td.ghost) td.ghost.remove();
  if(td.card) td.card.style.opacity='';
  var cells=document.querySelectorAll('.tcell'); for(var i=0;i<cells.length;i++) cells[i].className='tcell';
  if(!td.moved) return; // foi um toque → deixa abrir o detalhe
  window._suppressCardClick=true; setTimeout(function(){ window._suppressCardClick=false; },450);
  var cell=td.lastCell;
  if(cell) _moveTalkTo(td.id, cell.getAttribute('data-slot'), cell.getAttribute('data-room'));
}
function _initTouchDrag(){
  if(_initTouchDrag._done) return; _initTouchDrag._done=true;
  document.addEventListener('touchstart', _gridTouchStart, {passive:true});
  document.addEventListener('touchmove', _gridTouchMove, {passive:false});
  document.addEventListener('touchend', _gridTouchEnd, {passive:true});
  document.addEventListener('touchcancel', _gridTouchEnd, {passive:true});
}
_initTouchDrag();

var _darkMode = false;

var _sunIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
var _moonIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>';

function toggleDark(){
  _darkMode = !_darkMode;
  document.documentElement.setAttribute('data-theme', _darkMode ? 'dark' : '');
  var btn = document.getElementById('darkToggleBtn');
  if(btn) btn.innerHTML = _darkMode ? _sunIcon : _moonIcon;
  try{ localStorage.setItem('agenda_darkmode', _darkMode ? '1' : '0'); }catch(e){}
  try{ if(typeof applyTweaks==='function') applyTweaks(); }catch(e){}
}

function initDarkMode(){
  try{
    var saved = localStorage.getItem('agenda_darkmode');
    // Sem preferência salva → modo CLARO por padrão.
    if(saved === null){
      _darkMode = false;
    } else {
      _darkMode = saved === '1';
    }
  }catch(e){ _darkMode = false; }
  if(_darkMode){
    document.documentElement.setAttribute('data-theme','dark');
    var btn = document.getElementById('darkToggleBtn');
    if(btn) btn.innerHTML = _sunIcon;
  }
}

// PHOTO LIGHTBOX
// ════════════════════════════════════════
function openPhotoLb(src, name, role, company){
  if(!src) return;
  var ov=document.getElementById('photoLbOv');
  document.getElementById('photoLbImg').src=src;
  document.getElementById('photoLbName').textContent=name||'';
  document.getElementById('photoLbRole').textContent=role||'';
  var co=document.getElementById('photoLbCompany');
  if(co){ co.textContent=company||''; co.style.display=company?'block':'none'; }
  ov.style.display='flex';
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ ov.classList.add('on'); }); });
  document.addEventListener('keydown', _lbKey);
}
function closePhotoLb(){
  var ov=document.getElementById('photoLbOv');
  ov.classList.remove('on');
  ov.style.pointerEvents='none';
  setTimeout(function(){ ov.style.display='none'; document.getElementById('photoLbImg').src=''; ov.style.pointerEvents=''; },240);
  document.removeEventListener('keydown', _lbKey);
}
function _lbKey(e){ if(e.key==='Escape'){ closePhotoLb(); closeMapLb(); } }

// ════════════════════════════════════════
// MAP LIGHTBOX
// ════════════════════════════════════════
function openMapLb(src, caption){
  if(!src) return;
  var ov = document.getElementById('mapLbOv');
  document.getElementById('mapLbImg').src = src;
  document.getElementById('mapLbCaption').textContent = caption || '';
  document.getElementById('mapLbCaption').style.display = caption ? 'block' : 'none';
  ov.style.display = 'flex';
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ ov.classList.add('on'); }); });
  document.addEventListener('keydown', _lbKey);
}
function closeMapLb(){
  var ov = document.getElementById('mapLbOv');
  ov.classList.remove('on');
  ov.style.pointerEvents = 'none';
  setTimeout(function(){
    ov.style.display = 'none';
    document.getElementById('mapLbImg').src = '';
    ov.style.pointerEvents = '';
  }, 240);
  document.removeEventListener('keydown', _lbKey);
}

// INIT
// ════════════════════════════════════════
initDarkMode();
initWP();

// Restaura dia e view da sessão anterior
(function(){
  try{
    var s=JSON.parse(localStorage.getItem('agenda_ui_state')||'{}');
    if(typeof s.day==='number'&&s.day>=0&&s.day<NDAYS) curDay=s.day;
    if(s.view) curView=s.view;
    if(curView==='gantt') curView='grid';
    // Home é sempre a página inicial (não restaura a última aba)
    curPage='home';
  }catch(e){}
  try{ if(!localStorage.getItem('agenda_ui_state') && (window.matchMedia('(max-width:680px)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent))) curView='list'; }catch(e){}
})();

loadData(function(){
  applyMode();
  applyLang();        // idioma + abas de dia + legenda + grade + botão de idioma
  setView(curView);
  _updateZoomControls();
  showPage('home');
});

// ── Polling em tempo real — atualiza a cada 30s para todos os usuários ──
var _pollLastHash = '';
function _pollServer(){
  fetch(WP_API_BASE+'/wp-json/agenda/v1/load?_t='+Date.now(),{
    method:'GET', cache:'no-store',
    headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}
  })
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(res){
    if(!res.success||!res.data) return;
    // Usa updated_at como hash — só re-renderiza se houve mudança
    var hash = res.updated_at || JSON.stringify(res.debug||{});
    if(hash === _pollLastHash) return; // sem mudanças
    _pollLastHash = hash;
    // Não sobrescreve se o editor local está no meio de um save
    if(document.getElementById('saveIndicator')&&document.getElementById('saveIndicator').textContent.indexOf('Salvando')>-1) return;
    _applyServerData(res.data);
    _rerender();
    updateDayTabs();
  })
  .catch(function(){}); // silencia erros de rede
}
if(WP_ENABLED && WP_API_BASE) setInterval(_pollServer, 30000); // só quando conectado

<script>
var TWEAKS = /*EDITMODE-BEGIN*/{
  "cardStyle": "tint",
  "primary": "#611780",
  "radius": 12,
  "filet": 4
}/*EDITMODE-END*/;
function _twPersist(e){ try{ window.parent.postMessage({type:'__edit_mode_set_keys',edits:e},'*'); }catch(_){} }
function _twSeg(id,val){ var c=document.getElementById(id); if(!c) return; var bs=c.querySelectorAll('button'); for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-v')===String(val)); }
function applyTweaks(){
  var b=document.body, r=document.documentElement;
  b.setAttribute('data-cardstyle', TWEAKS.cardStyle==='filete'?'':TWEAKS.cardStyle);
  // No dark mode o acento é o laranja da marca (definido no CSS): não sobrepor.
  var _dark = r.getAttribute('data-theme')==='dark';
  if(_dark){ r.style.removeProperty('--brand'); r.style.removeProperty('--blue'); }
  else { r.style.setProperty('--brand', TWEAKS.primary); r.style.setProperty('--blue', TWEAKS.primary); }
  r.style.setProperty('--r', TWEAKS.radius+'px');
  r.style.setProperty('--filet', TWEAKS.filet+'px');
  _twSeg('twCardStyle', TWEAKS.cardStyle);
  _twSeg('twPrimary', TWEAKS.primary);
  var rr=document.getElementById('twRadius'); if(rr){ rr.value=TWEAKS.radius; document.getElementById('twRadiusVal').textContent=TWEAKS.radius+'px'; }
  var rf=document.getElementById('twFilet'); if(rf){ rf.value=TWEAKS.filet; document.getElementById('twFiletVal').textContent=TWEAKS.filet+'px'; }
}
function _tweaksClose(){ var p=document.getElementById('tweaksPanel'); if(p) p.style.display='none'; try{ window.parent.postMessage({type:'__edit_mode_dismissed'},'*'); }catch(_){} }
// listener ANTES de anunciar disponibilidade
window.addEventListener('message', function(e){
  var d=e.data||{};
  if(d.type==='__activate_edit_mode'){ var p=document.getElementById('tweaksPanel'); if(p) p.style.display='block'; }
  else if(d.type==='__deactivate_edit_mode'){ var p=document.getElementById('tweaksPanel'); if(p) p.style.display='none'; }
});
(function(){
  var cs=document.getElementById('twCardStyle'); if(cs) cs.addEventListener('click',function(e){ var v=e.target.getAttribute&&e.target.getAttribute('data-v'); if(!v)return; TWEAKS.cardStyle=v; applyTweaks(); _twPersist({cardStyle:v}); });
  var pr=document.getElementById('twPrimary'); if(pr) pr.addEventListener('click',function(e){ var v=e.target.getAttribute&&e.target.getAttribute('data-v'); if(!v)return; TWEAKS.primary=v; applyTweaks(); _twPersist({primary:v}); });
  var rd=document.getElementById('twRadius'); if(rd){ rd.addEventListener('input',function(){ TWEAKS.radius=+this.value; applyTweaks(); }); rd.addEventListener('change',function(){ _twPersist({radius:+this.value}); }); }
  var fl=document.getElementById('twFilet'); if(fl){ fl.addEventListener('input',function(){ TWEAKS.filet=+this.value; applyTweaks(); }); fl.addEventListener('change',function(){ _twPersist({filet:+this.value}); }); }
  applyTweaks();
  try{ window.parent.postMessage({type:'__edit_mode_available'},'*'); }catch(_){}
})();
</script>
